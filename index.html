:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}
/* Layout: cabeçalho com o nome em destaque e o termômetro do mês; navegação em pílulas; cada visão é uma coluna de painéis; tabelas largas rolam no próprio contêiner.
   Ideia: aproveitar a vida (rosa-vibrante, títulos expressivos) sem perder o controle (verde/amarelo/vermelho do termômetro). */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface2:#ebeee8; --ink:#1e1630; --muted:#625a70; --line:#d9dcd3;
  --accent:#d1336a; --accent-ink:#ffffff; --good:#1d8348; --bad:#c62828; --warn:#b86e00; --hl:#fde4ee;
  --nubank:#7a2fa0; --mp:#0089c7; --santander:#c62828; --pix:#2e7d32; --extra:#8a6d1d; --cofre:#d08a00;
  --f-display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1e1926; --surface2:#2a2433; --ink:#f2edf7; --muted:#a79fb3; --line:#352e40;
  --accent:#ff6a9b; --accent-ink:#2a0a17; --good:#5cc985; --bad:#ff7b6b; --warn:#f2b04c; --hl:#3d2232;
  --nubank:#b67ad6; --mp:#4fb8e8; --santander:#ef6b6b; --pix:#6cc070; --extra:#d6b45a; --cofre:#f0b04a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1e1926; --surface2:#2a2433; --ink:#f2edf7; --muted:#a79fb3; --line:#352e40;
  --accent:#ff6a9b; --accent-ink:#2a0a17; --good:#5cc985; --bad:#ff7b6b; --warn:#f2b04c; --hl:#3d2232;
  --nubank:#b67ad6; --mp:#4fb8e8; --santander:#ef6b6b; --pix:#6cc070; --extra:#d6b45a; --cofre:#f0b04a; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(20px,3.2vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.brand-wrap{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;flex:none;display:block}.logo-dark{display:none}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:block}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .tag{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);letter-spacing:.02em}
.brand .tag::before{content:"";display:inline-block;width:18px;height:2px;background:var(--accent);vertical-align:middle;margin-right:6px}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.termo{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border-radius:999px;font-weight:600;font-size:13px;background:var(--surface2);border:1px solid var(--line)}
.termo .bar{display:inline-flex;gap:3px}
.termo .bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.termo[data-s="ok"] .bar i:nth-child(1){background:var(--good)}
.termo[data-s="lim"] .bar i:nth-child(2){background:var(--warn)}
.termo[data-s="neg"] .bar i:nth-child(3){background:var(--bad)}
.termo[data-s="neg"]{color:var(--bad);border-color:var(--bad)}
.kpi .val{letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px 8px}
.topbar .sel{display:flex;gap:8px;margin-left:auto;align-items:center}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 60px}
.view{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-family:var(--f-display);font-size:22px;font-weight:800;margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)} .muted{color:var(--muted)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{text-align:right}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad)}
button.link{background:none;border:none;padding:2px 4px;color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tr.auto td{color:var(--muted);font-style:italic}
.banner.warn{border-color:var(--warn);color:var(--warn)}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.sec td{background:var(--surface2);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ytab td:first-child,.ytab th:first-child{position:sticky;left:0;background:var(--surface);min-width:210px}
.ytab input{width:84px;padding:4px 6px}
.cell-bad{color:var(--bad);font-weight:700}
.cell-good{color:var(--good);font-weight:700}
.ytab tr.hl td{background:var(--hl);font-weight:700}
.ytab tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.card{color:#fff}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 180px}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line)}
.banner.bad{border-color:var(--bad);color:var(--bad)}
.chart-box{position:relative;height:260px}
.legend-list{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,14,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(620px,100%);padding:18px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px 12px;margin-block:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.form .err{color:var(--bad);font-size:12px;grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .left{margin-right:auto}
details.adv summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:4px}
.trip{display:flex;flex-direction:column;gap:10px}
.trip table input{width:100%;min-width:70px}
.trip table input.n{width:64px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;font-weight:600}
.lock{font-size:12px;color:var(--warn);font-weight:600}
.sim-item{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:var(--r);padding:4px 14px 10px;margin:0 0 12px;min-width:0}
.sim-item.ganho{border-left-color:var(--good)}
.sim-item legend{font-family:var(--f-display);font-weight:700;padding:0 6px}
.sim-item .form{margin-block:6px}
.sim-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sim-add label{display:flex;gap:6px;align-items:center;margin-left:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<script>
"use strict";
/* ===================== REGRAS (mesma lógica da planilha) ===================== */
const MESES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MES_CURTO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const PAG='Pagamento de fatura', C3='Cartão de 3º', ATE=999999;
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>v==null||isNaN(v)?'—':brl.format(v);
const mtxt=a=>a==null?'':(a>=ATE?'até cancelar':MESES[(a-1)%12]+' '+Math.floor((a-1)/12));
const mshort=a=>a==null?'':(a>=ATE?'até cancelar':MES_CURTO[(a-1)%12]+'/'+String(Math.floor((a-1)/12)).slice(2));
function pd(s){ if(!s) return null; const p=String(s).split('-').map(Number); return p.length===3&&p[0]?{y:p[0],m:p[1],d:p[2]}:null }
function fmtD(s){ const d=pd(s); return d?String(d.d).padStart(2,'0')+'/'+String(d.m).padStart(2,'0')+'/'+d.y:'' }
function nn(v){ return typeof v==='number'&&!isNaN(v)?v:null }

const Calc={
  fech(cfg,nome){ const c=(cfg.cartoes||[]).find(c=>c.nome===nome); return c&&c.fech?Number(c.fech):null },
  absMes(r,fech){
    const d=pd(r.data);
    if(r.mes){ const y=r.ano||(d?d.y:null); return y?y*12+Number(r.mes):null }
    if(!d) return null;
    return d.y*12+d.m+(fech&&d.d>=fech?1:0);
  },
  compra(c,cfg){ return {...c, fat: nn(c.valor)==null?null:Calc.absMes(c,Calc.fech(cfg,c.cartao))} },
  fixo(f,cfg){
    const vazio=nn(f.total)==null&&nn(f.parcela)==null;
    if(vazio) return {...f,ini:null,fim:null,cheio:0,sua:0,volta:0};
    const ini=Calc.absMes(f,Calc.fech(cfg,f.onde));
    let fim=null;
    if(ini!=null){
      if(f.ultMes){ fim=(f.ultAno||Math.floor((ini-1)/12))*12+Number(f.ultMes) }
      else if(!f.vezes){ fim=f.tipo==='Empréstimo'?ini:((f.tipo==='Assinatura'||f.tipo==='Conta fixa')?ATE:Math.floor((ini-1)/12)*12+12) }
      else fim=ini+Math.max(1,f.vezes)-1;
    }
    const cheio=nn(f.total)!=null?(f.vezes?f.total/Math.max(1,f.vezes):f.total):f.parcela;
    const div=Math.max(1,Number(f.dividir)||0);
    const sua=f.terceiro?0:cheio/div;
    const volta=f.terceiro?cheio:(f.voltam==null||f.voltam===''?cheio-sua:cheio*Number(f.voltam)/div);
    return {...f,ini,fim,cheio,sua,volta};
  },
  entrada(e){
    const vazio=nn(e.total)==null&&nn(e.parcela)==null;
    if(vazio) return {...e,ini:null,fim:null,cheio:0,dest:null};
    const ini=Calc.absMes(e,null);
    const fim=ini==null?null:(e.vezes?ini+Math.max(1,e.vezes)-1:Math.floor((ini-1)/12)*12+12);
    const cheio=nn(e.total)!=null?(e.vezes?e.total/Math.max(1,e.vezes):e.total):e.parcela;
    const c=e.cat; const dest=c==='Bolsa'?'B':c==='Entrada única'?'U':c==='Entrada parcelada'?'P':(c==='Estorno de amigos'||c==='Estorno de compra')?'E':(Number(e.vezes)===1?'U':'P');
    return {...e,ini,fim,cheio,dest};
  },
  meta(m){ const ini=m.iniAno&&m.iniMes?m.iniAno*12+m.iniMes:null, fim=m.fimAno&&m.fimMes?m.fimAno*12+m.fimMes:null;
    return {...m,ini,fim,meses:ini&&fim?fim-ini+1:null,porMes:ini&&fim?m.valor/Math.max(1,fim-ini+1):null} },
  prep(S){ // aplica as regras a tudo
    const cfg=S.config;
    return { cfg,
      compras:S.compras.map(c=>Calc.compra(c,cfg)),
      fixos:S.fixos.map(f=>Calc.fixo(f,cfg)),
      entradas:S.entradas.map(Calc.entrada),
      metas:S.metas.map(Calc.meta), deps:S.deps, anos:S.anos };
  },
  mes(P,a,extra){ // tudo de um mês absoluto
    const y=Math.floor((a-1)/12), m=a-y*12, yd=P.anos[y]||{};
    const noMes=f=>{ const p=f.pagos&&f.pagos[a]; if(p&&nn(p.valor)!=null&&f.cheio){ const k=p.valor/f.cheio; return {...f,cheio:p.valor,sua:f.sua*k,volta:f.volta*k} } return f }; // valor do mês informado (contas de consumo)
    const F=P.fixos.filter(f=>f.ini!=null&&f.ini<=a&&a<=f.fim).map(noMes).concat(extra&&extra.fixos?extra.fixos.filter(f=>f.ini<=a&&a<=f.fim):[]);
    const E=P.entradas.filter(e=>e.ini!=null&&e.ini<=a&&a<=e.fim).concat(extra&&extra.entradas?extra.entradas.filter(e=>e.ini<=a&&a<=e.fim):[]);
    const C=P.compras.filter(c=>c.fat===a).concat(extra&&extra.compras?extra.compras.filter(c=>c.fat===a):[]);
    const sum=(arr,fn)=>arr.reduce((s,x)=>s+(fn(x)||0),0);
    const r={a,y,m};
    r.vovo=nn((yd.vovo||[])[m-1])||0; r.mae=nn((yd.mae||[])[m-1])||0;
    r.bolsa=sum(E.filter(e=>e.dest==='B'),e=>e.cheio);
    r.extras=sum(E.filter(e=>e.dest==='U'),e=>e.cheio);
    r.receb=sum(E.filter(e=>e.dest==='P'),e=>e.cheio);
    r.estornos=sum(E.filter(e=>e.dest==='E'),e=>e.cheio)+sum(F.filter(f=>f.onde!==C3),f=>f.volta);
    r.in=r.vovo+r.mae+r.bolsa+r.extras+r.receb+r.estornos;
    r.fixos=sum(F.filter(f=>f.tipo!=='Empréstimo'&&f.onde!==C3),f=>f.cheio);
    r.cards={}; r.fat={}; r.falta={}; r.app={}; r.dif={};
    const cartoes=(P.cfg.cartoes||[]).map(c=>c.nome);
    cartoes.forEach(n=>{
      r.cards[n]=sum(C.filter(c=>c.cartao===n&&c.cat!==PAG),c=>c.valor);
      r.fat[n]=r.cards[n]+sum(F.filter(f=>f.onde===n),f=>f.cheio);
      r.falta[n]=r.fat[n]-sum(C.filter(c=>c.cartao===n&&c.cat===PAG),c=>c.valor);
      const ap=yd.app&&yd.app[n]?nn(yd.app[n][m-1]):null; r.app[n]=ap; r.dif[n]=ap==null?null:r.falta[n]-ap;
    });
    r.c3=sum(F.filter(f=>f.onde===C3),f=>f.sua);
    r.loan=sum(F.filter(f=>f.tipo==='Empréstimo'&&f.onde!==C3),f=>f.cheio);

  },

function memDb(seed){
  const store={}; const subs=[];
  Object.entries(seed).forEach(([col,docs])=>{ store[col]={}; Object.entries(docs).forEach(([id,d])=>store[col][id]=d) });
  const snapC=col=>({docs:Object.entries(store[col]||{}).map(([id,d])=>({id,exists:true,data:()=>d})),metadata:{fromCache:false}});
  const notify=col=>subs.filter(s=>s.col===col).forEach(s=>s.fn(s.doc?{id:s.doc,exists:!!(store[col]||{})[s.doc],data:()=>(store[col]||{})[s.doc],metadata:{fromCache:false}}:snapC(col)));
  const docRef=(col,id)=>({id,set:async d=>{(store[col]=store[col]||{})[id]=JSON.parse(JSON.stringify(d));notify(col)},delete:async()=>{delete (store[col]||{})[id];notify(col)},
    onSnapshot:(fn)=>{subs.push({col,doc:id,fn});setTimeout(()=>notify(col),0);return()=>{}}});
  return {collection:col=>({doc:id=>docRef(col,id||('l'+Math.random().toString(36).slice(2,10))),onSnapshot:fn=>{subs.push({col,fn});setTimeout(()=>fn(snapC(col)),0);return()=>{}}}),
          doc:path=>{const [c,i]=path.split('/');return docRef(c,i)}};
}

   ${cs.map(f=>`<tr><td><input type="checkbox" data-cpago="${f.id}" ${contaPaga(f,a)?'checked':''} aria-label="Marcar ${esc(f.desc)} como paga"></td><td><button class="link" data-cedit="${f.id}">${esc(f.desc)}</button><div class="note">${esc(f.onde||'')}</div></td><td>${sit(f)}</td><td class="r"><input type="text" inputmode="decimal" data-cval="${f.id}" value="${String(Math.round(valConta(f,a)*100)/100).replace('.',',')}" style="width:96px" aria-label="Valor de ${esc(f.desc)} neste mês"></td></tr>`).join('')}
   <tr class="tot"><td></td><td>Total</td><td class="note">falta pagar ${money(falta)}</td><td class="r num">${money(tot)}</td></tr></tbody></table></div>
   <p class="note">Marque quando pagar. Se a conta veio com outro valor (luz, água…), troque aqui: vale só para este mês e entra nos fixos do mês.</p>`
   :`<div class="empty">Nenhuma conta da casa ainda. Cadastre água, luz, internet, aluguel… em “+ Nova conta”.</div>`}</section>`;
}
function ligarContas(root,a){
  const sv=async(id,fn)=>{ const f=S.fixos.find(x=>x.id===id); if(!f) return false; const o={...f}; delete o.id; o.pagos={...(o.pagos||{})}; const cur={...(o.pagos[a]||{})}; fn(cur);
    if(cur.pago||cur.valor!=null) o.pagos[a]=cur; else delete o.pagos[a]; return put('fixos',id,clean(o)) };
  root.querySelectorAll('[data-cpago]').forEach(cb=>cb.onchange=async()=>{ if(await sv(cb.dataset.cpago,c=>{ if(cb.checked) c.pago=true; else delete c.pago })) toast(cb.checked?'Conta marcada como paga':'Marcação desfeita') });
  root.querySelectorAll('[data-cval]').forEach(inp=>inp.onchange=()=>{ const v=parseMoney(inp.value); if(Number.isNaN(v)){ toast('Valor inválido'); return } sv(inp.dataset.cval,c=>{ if(v==null) delete c.valor; else c.valor=v }) });
  root.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>openForm('fixos',b.dataset.cedit));
  const nb=root.querySelector('#novaConta'); if(nb){ const y=Math.floor((a-1)/12), m=a-y*12; nb.onclick=()=>openForm('fixos',null,{tipo:'Conta fixa',onde:'Boleto',data:`${y}-${String(m).padStart(2,'0')}-01`,desc:''}) }
}

    {label:'Entrou',data:ms.map(x=>x.in),backgroundColor:css('--good'),order:2},

  main.querySelectorAll('input[data-orc]').forEach(inp=>inp.addEventListener('change',()=>{ const v=parseMoney(inp.value); if(Number.isNaN(v)){toast('Valor inválido');return} const dd=anoDoc(y); if(v==null) delete dd.orcamento[inp.dataset.orc]; else dd.orcamento[inp.dataset.orc]=v; saveAno(y,dd); refresh() }));

function chipCard(n){ const i=(P.cfg.cartoes||[]).findIndex(c=>c.nome===n); return n?`<span class="chip ${i>=0?'card':''}" style="${i>=0?'background:'+cardColor(n,i):''}">${esc(n)}</span>`:'<span class="cell-bad">sem cartão</span>' }

    body=linhas.map(l=>l.c?`<tr class="click" data-id="${l.c.id}"><td class="num">${fmtD(l.c.data)||'<span class="note">'+mshort(l.c.fat)+'</span>'}</td><td>${esc(l.c.desc)}</td><td>${chipCard(l.c.cartao)}</td><td>${l.c.cat?esc(l.c.cat):'<span class="cell-bad">sem categoria</span>'}</td><td class="r num">${money(l.c.valor)}</td><td class="note">${mshort(l.c.fat)}</td></tr>`
      :`<tr class="click auto" data-fx="${l.x.f.id}" title="Entra sozinho todo mês. Clique para ver o cadastro em Fixos e parcelas."><td class="note">${rot(l.x)}</td><td>${esc(l.x.f.desc)} <span class="chip">automático</span></td><td>${chipCard(l.x.f.onde)}</td><td>${esc(l.x.f.tipo||'')}</td><td class="r num">${money(l.x.v)}</td><td class="note">${mshort(l.x.m)}</td></tr>`).join('');
  } else if(lancTab==='fixos'){
    list=P.fixos.filter(f=>inPeriod(f.ini,f.fim)&&filtTxt(f)).sort((p,q)=>(p.ini-q.ini)||((p.ordem||0)-(q.ordem||0)));
    cols='<th>Descrição</th><th>Tipo</th><th>Onde</th><th class="r">Por mês</th><th>Período</th><th class="r">Sua parte</th><th class="r">Volta p/ você</th>';
    body=list.map(f=>`<tr class="click" data-id="${f.id}"><td>${esc(f.desc)}${f.dividir?` <span class="chip">÷${f.dividir}${f.voltam!=null&&f.voltam!==''?' · voltam '+f.voltam:''}</span>`:''}${f.terceiro?` <span class="chip">de ${esc(f.terceiro)}</span>`:''}${f.pessoas?` <span class="chip">com ${esc(f.pessoas)}</span>`:''}</td><td>${esc(f.tipo||'')}</td><td>${chipCard(f.onde)}</td><td class="r num">${money(f.cheio)}</td><td class="note">${mshort(f.ini)} → ${mshort(f.fim)}${f.vezes?' ('+f.vezes+'x)':''}</td><td class="r num">${money(f.sua)}</td><td class="r num">${f.volta?money(f.volta):''}</td></tr>`).join('');
  } else {
    list=P.entradas.filter(e=>inPeriod(e.ini,e.fim)&&filtTxt(e)).sort((p,q)=>(p.ini-q.ini)||String(p.data||'').localeCompare(String(q.data||'')));
    cols='<th>Data</th><th>Descrição</th><th>De quem</th><th>Categoria</th><th class="r">Por mês</th><th>Período</th>';
    body=list.map(e=>`<tr class="click" data-id="${e.id}"><td class="num">${fmtD(e.data)||'<span class="note">'+mshort(e.ini)+'</span>'}</td><td>${esc(e.desc)}</td><td>${esc(e.deQuem||'')}</td><td>${esc(e.cat||'')}</td><td class="r num">${money(e.cheio)}</td><td class="note">${e.ini===e.fim?mshort(e.ini):mshort(e.ini)+' → '+mshort(e.fim)}</td></tr>`).join('');
  }
  const total=lancTab==='compras'?list.filter(c=>c.cat!==PAG).reduce((s,c)=>s+c.valor,0):lancTab==='fixos'?list.reduce((s,f)=>s+f.sua,0):list.reduce((s,e)=>s+e.cheio,0);
  const nome={compras:'Compras',fixos:'Fixos e parcelas',entradas:'Entradas'}[lancTab];
  main.innerHTML=`<div class="view"><section class="panel">
   <div class="panel-head"><div class="subtabs" role="group" aria-label="Tipo de lançamento">
     ${['compras','fixos','entradas'].map(t=>`<button data-t="${t}" aria-pressed="${t===lancTab}">${{compras:'Compras',fixos:'Fixos e parcelas',entradas:'Entradas'}[t]}</button>`).join('')}</div>
     <button class="primary" id="btnNovo">+ ${lancTab==='compras'?'Nova compra':lancTab==='fixos'?'Novo fixo ou parcela':'Nova entrada'}</button></div>
   <div class="filters"><input type="search" id="busca" placeholder="Buscar (descrição, pessoa, cartão…)" value="${esc(lancBusca)}" aria-label="Buscar lançamentos">
     <label class="note"><input type="checkbox" id="todoAno" ${lancTodoAno?'checked':''}> o ano todo</label></div>
   <p class="note">${nome} ${lancTodoAno?'de '+y:'da fatura de '+MESES[selMes-1].toLowerCase()+' '+y} · ${list.length} ${list.length===1?'lançamento':'lançamentos'} · ${lancTab==='fixos'?'sua parte':'total'}: <b class="num">${money(total)}</b>${lancTab==='compras'?' (sem pagamentos de fatura)':''}${autos.length?` · mais <b class="num">${money(autos.reduce((s,x)=>s+x.v,0))}</b> em ${autos.length} ${autos.length===1?'parcela/fixo automático':'parcelas e fixos automáticos'} (em cinza; já entram sozinhos, não lance de novo)`:''}</p>
   <div class="scroll">${list.length||autos.length?`<table><thead><tr>${cols}</tr></thead><tbody>${body}</tbody></table>`:`<div class="empty">Nada aqui neste período. Use “${lancTab==='compras'?'Nova compra':lancTab==='fixos'?'Novo fixo ou parcela':'Nova entrada'}” para lançar.</div>`}</div>
  </section></div>`;
  main.querySelectorAll('.subtabs button').forEach(b=>b.addEventListener('click',()=>{ lancTab=b.dataset.t; render() }));
  const bus=$('#busca'); bus.addEventListener('input',()=>{ lancBusca=bus.value; clearTimeout(bus._t); bus._t=setTimeout(()=>{ render(); const nb=$('#busca'); nb.focus(); nb.setSelectionRange(nb.value.length,nb.value.length) },350) });
  $('#todoAno').addEventListener('change',e=>{ lancTodoAno=e.target.checked; render() });
  $('#btnNovo').addEventListener('click',()=>openForm(lancTab,null));
  main.querySelectorAll('tr.click').forEach(tr=>tr.addEventListener('click',()=>tr.dataset.fx?openForm('fixos',tr.dataset.fx):openForm(lancTab,tr.dataset.id)));

/* ---------- alerta de duplicidade (compra igual a parcela/fixo do mês ou a outra compra) ---------- */
/* nomes: ignora acentos, "parcela 3/6", sufixos de pagamento e palavras curtas; parecido = compartilha uma palavra de 4+ letras */
const PALAVRAS_VAZIAS=new Set(['nupay','pix','credito','debito','compra','pagamento','parcela','brasil','ltda','com','para','loja','mercadopago']);
function palavras(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/parcela\s*\d+\s*\/\s*\d+/g,' ').replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w.length>=4&&!PALAVRAS_VAZIAS.has(w)) }
function nomeParecido(a,b){ const A=palavras(a), B=palavras(b); if(!A.length||!B.length) return false;
  return A.some(x=>B.some(y=>x===y||(x.length>=5&&y.includes(x))||(y.length>=5&&x.includes(y)))) }
function nomesDoFixo(f){ return [f.desc,f.apelido].filter(Boolean).join(' ') }
/* pessoas que dividem: campo "Com quem" (separado por vírgula) + "De terceiro" */
function pessoasDoFixo(f){ return String([f.pessoas,f.terceiro].filter(Boolean).join(',')).split(/[,;/]| e /).map(s=>s.trim()).filter(s=>palavras(s).length) }
function quemDivide(texto,a){ // fixos ativos perto do mês a cuja lista de pessoas aparece no texto
  const out=[]; P.fixos.forEach(f=>{ if(f.ini==null||f.ini>a+1||f.fim<a-1) return;
    const p=pessoasDoFixo(f).find(n=>nomeParecido(texto,n)); if(p) out.push({f,p}) }); return out }
function parteDe(f){ const div=Math.max(1,Number(f.dividir)||1); return f.terceiro?f.cheio:f.cheio/div }
function possiveisDuplicados(o,id){
  const c=Calc.compra(o,P.cfg), v=nn(o.valor); if(c.fat==null||v==null) return [];
  const avisos=[];
  P.fixos.filter(f=>f.onde===o.cartao&&f.ini!=null&&f.ini<=c.fat&&c.fat<=f.fim).forEach(f=>{
    const fv=valConta(f,c.fat), mesmoValor=Math.abs(fv-v)<0.05, parecido=nomeParecido(o.desc,nomesDoFixo(f)), perto=Math.abs(fv-v)<=Math.max(1,fv*0.1);
    if(!(mesmoValor||(parecido&&perto))) return;
    const n=f.vezes?` (parcela ${c.fat-f.ini+1}/${f.vezes})`:'';
    const pq=mesmoValor&&parecido?'mesmo valor e nome parecido':mesmoValor?'mesmo valor':'nome parecido e valor próximo';
    avisos.push(`Atenção (${pq}): “${f.desc}”${n} já entra sozinho na fatura de ${mtxt(c.fat).toLowerCase()} com ${money(fv)}. Lançar aqui pode contar duas vezes.`) });
  const dd=(a,b)=>{ const x=pd(a),y=pd(b); return x&&y?Math.abs((Date.UTC(x.y,x.m-1,x.d)-Date.UTC(y.y,y.m-1,y.d))/864e5):99 };
  P.compras.filter(x=>x.id!==id&&x.cartao===o.cartao&&Math.abs(x.valor-v)<0.011).forEach(x=>{
    const perto=o.data&&x.data?dd(o.data,x.data)<=3:x.fat===c.fat, parecido=nomeParecido(o.desc,x.desc);
    if(!(perto||(parecido&&x.fat===c.fat))) return;

  frm.addEventListener('input',preview); preview();

      if(av.length){ $('#ferr').innerHTML=`<div class="banner warn">${av.map(esc).join('<br>')}<br>Se for mesmo outra compra, clique em “Salvar mesmo assim”.</div>`; $('#bSave').dataset.ok='1'; $('#bSave').textContent='Salvar mesmo assim'; return } }

<script>
"use strict";

function vSim(main){

  let cG=0,cE=0;

    <div class="form">
     <label class="wide">${g?'O que você vai receber':'O que você quer comprar'}<input name="desc" value="${esc(it.desc)}" placeholder="${g?'ex.: freela, bolsa nova, venda':'ex.: passagem para o Rio'}"></label>
     <label>Valor total (R$)<input name="valor" inputmode="decimal" value="${esc(it.valor)}"></label>
     <label>${g?'Em quantos meses':'Vezes'}<input name="vezes" inputmode="numeric" value="${esc(it.vezes)}"></label>
     ${g?`<label>Categoria<select name="catE">${opts(P.cfg.catEntrada||[],it.catE)}</select></label>`:`<label>Onde<select name="onde">${opts(cartoes.concat([C3]),it.onde)}</select></label>`}
     <label>${g?'Data do 1º recebimento':'Data da compra'}<input type="date" name="data" value="${esc(it.data)}"></label>
     ${g?'':`<label>Dividir entre (pessoas, contando você)<input name="dividir" inputmode="numeric" value="${esc(it.dividir)}"></label>`}
    </div>
    ${sim.itens.length>1?`<button type="button" class="link danger" data-rm="${k}">Remover ${g?'este ganho':'este gasto'}</button>`:''}</fieldset>` };
  main.innerHTML=`<div class="view"><section class="panel"><div class="panel-head"><h2>Simulador</h2><span class="note">nada é salvo até você clicar em “Lançar de verdade”</span></div>
   <p class="note" style="margin-top:0">Junte gastos e ganhos para ver o efeito de tudo junto em cada mês. Itens sem valor ficam de fora.</p>
   <form id="sf" onsubmit="return false">${sim.itens.map(bloco).join('')}
    <div class="sim-add"><button type="button" data-add="gasto">+ Gasto</button><button type="button" data-add="ganho">+ Ganho</button>
     <label class="note">Meses para mostrar<input name="meses" inputmode="numeric" value="${esc(sim.meses)}" style="width:64px"></label></div>
   </form><div id="sres"></div></section></div>`;
  main.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ sim.itens.push(novoItemSim(b.dataset.add)); render() });

function simRecord(it){
  const valor=parseMoney(it.valor), vezes=Math.max(1,parseInt(it.vezes)||1), div=Math.max(1,parseInt(it.dividir)||1);

}

    if(sr.kind==='compras'){ x=Calc.compra(sr.rec,P.cfg); ex.compras.push(x); ini=fim=x.fat; porMes=pesa=x.valor }
    else if(sr.kind==='fixos'){ x=Calc.fixo(sr.rec,P.cfg); ex.fixos.push(x); ini=x.ini; fim=x.fim; porMes=x.cheio; pesa=sr.rec.onde===C3?x.sua:x.cheio-x.volta }
    else { x=Calc.entrada(sr.rec); ex.entradas.push(x); ini=x.ini; fim=x.fim; porMes=pesa=x.cheio }
    if(ini==null){ box.innerHTML=`<p class="empty">Confira a data de “${esc(sr.rec.desc)}”.</p>`; return }
    info.push({it,sr,g,ini,fim,porMes,pesa}) }
  const tem={g:info.some(i=>!i.g),e:info.some(i=>i.g)};
  const extra={compras:exG.compras.concat(exE.compras),fixos:exG.fixos.concat(exE.fixos),entradas:exG.entradas.concat(exE.entradas)};

  const n=Math.min(120,Math.max(parseInt(sim.meses)||6,fim-ini+1)); const rows=[];
  for(let a=ini;a<ini+n;a++){ const antes=Calc.mes(P,a).dif_, soG=tem.g?Calc.mes(P,a,exG).dif_:antes, depois=Calc.mes(P,a,extra).dif_;
    rows.push({a,antes,depois,gasto:soG-antes,ganho:depois-soG,imp:depois-antes}) }

  const viraNeg=rows.filter(r=>r.depois<0&&r.antes>=0).length, saiNeg=rows.filter(r=>r.antes<0&&r.depois>=0).length;
  const efeito=rows.reduce((s,r)=>s+r.imp,0);
  let aviso='';

  if(saiNeg) aviso+=`<div class="banner" style="margin-top:12px;border-color:var(--good);color:var(--good)">Com a simulação, ${saiNeg} ${saiNeg===1?'mês sai':'meses saem'} do vermelho.</div>`;

  const sinal=v=>v>0.004?'+'+money(v):v<-0.004?'−'+money(-v):'';

     <div class="kpi"><div class="lbl">Efeito total na sobra</div><div class="val num ${efeito<0?'neg':'pos'}">${sinal(efeito)||money(0)}</div></div>
     <div class="kpi"><div class="lbl">Mês mais apertado</div><div class="val num ${pior.depois<0?'neg':'pos'}" style="font-size:16px">${mshort(pior.a)} · ${money(pior.depois)}</div></div></div>
   <div class="scroll" style="margin-top:10px"><table><thead><tr><th>Item</th><th>Meses</th><th class="r">Valor por mês</th><th class="r">No seu mês</th></tr></thead><tbody>
    ${info.map(i=>`<tr><td><span class="dot" style="background:var(${i.g?'--good':'--bad'})"></span>${esc(i.sr.rec.desc)}</td><td class="note">${mshort(i.ini)}${i.fim!==i.ini?' → '+mshort(i.fim):''}</td><td class="r num">${money(i.porMes)} <span class="note">${rotulo(i).toLowerCase()}</span></td><td class="r num ${i.g?'pos':'neg'}">${i.g?'+':'−'}${money(i.pesa)}</td></tr>`).join('')}</tbody></table></div>

/* ===================== CONFERIR EXTRATO / FATURA ===================== */
const conf={tipo:'fatura',cartao:'',itens:null,arquivo:'',saldo:null,ate:null,erro:'',sel:{},cat:{}};
function lerOFX(txt){
  const tag=(b,t)=>{ const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m?m[1].trim():'' };
  const d8=s=>s&&s.length>=8?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8):null;
  const itens=[]; const re=/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi; let m;
  while((m=re.exec(txt))){ const b=m[1]; const v=parseFloat(tag(b,'TRNAMT').replace(',','.')); if(isNaN(v)) continue;
    itens.push({data:d8(tag(b,'DTPOSTED')),desc:tag(b,'MEMO')||tag(b,'NAME'),valor:v}) }
  const bal=parseFloat(tag(txt,'BALAMT'));
  return {tipo:/CREDITCARDMSGSRSV1/i.test(txt)?'fatura':'extrato',itens,saldo:isNaN(bal)?null:bal,ate:d8(tag(txt,'DTASOF'))||d8(tag(txt,'DTEND'))};
}
function lerCSV(txt){
  const linhas=txt.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(linhas.length<2) return {tipo:null,itens:[]};
  const sep=(linhas[0].split(';').length>linhas[0].split(',').length)?';':',';
  const split=l=>{ const out=[]; let cur='',q=false; for(const ch of l){ if(ch==='"'){ q=!q; continue } if(ch===sep&&!q){ out.push(cur); cur=''; continue } cur+=ch } out.push(cur); return out.map(s=>s.trim()) };
  const h=split(linhas[0]).map(s=>s.toLowerCase());
  const ci=(...ns)=>h.findIndex(x=>ns.some(n=>x.includes(n)));
  const iD=ci('data','date'), iV=ci('valor','amount','value'), iT=ci('descri','title','memo','hist','estabelec');
  if(iD<0||iV<0) throw new Error('não achei as colunas de data e valor no arquivo');
  const fat=h.includes('title')||h.includes('amount');   // CSV da fatura do Nubank: valor positivo = compra
  const dt=s=>{ let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3]; m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m?m[3]+'-'+m[2]+'-'+m[1]:null };
  const itens=linhas.slice(1).map(split).map(c=>{ let v=parseMoney(c[iV]); if(v==null||Number.isNaN(v)) return null; if(fat) v=-v; return {data:dt(c[iD]||''),desc:c[iT]||'',valor:v} }).filter(Boolean);
  return {tipo:fat?'fatura':null,itens};
}
function adivinharCat(d){ d=String(d).toLowerCase();
  if(/ifood|99food|food|restaurant|lanch|sorvet|padaria|panific|pizza|burg|subway|chopp|feira|mercado|super/.test(d)) return 'iFood + Fome';
  if(/uber|^99|99 -|99pop|taxi|moto|metr|ônibus|onibus|jaé/.test(d)) return 'Uber/99';
  if(/farm|drog/.test(d)) return 'Autocuidado';
  return 'Extras' }
function diasEntre(a,b){ const x=pd(a),y=pd(b); if(!x||!y) return 99; return Math.abs((Date.UTC(x.y,x.m-1,x.d)-Date.UTC(y.y,y.m-1,y.d))/864e5) }
function classificar(){
  const isF=conf.tipo==='fatura', card=isF?conf.cartao:'Pix/Débito', fech=Calc.fech(P.cfg,card);
  const usadosC=new Set(), usadosE=new Set(), itens=conf.itens||[], pre={};
  // compra + estorno do mesmo dia e mesmo nome, lançados juntos (valor líquido)
  itens.forEach((t,i)=>{ if(t.valor>0&&!/pagamento/i.test(t.desc||'')&&!(i in pre)){
    const j=itens.findIndex((u,k)=>k!==i&&!(k in pre)&&u.valor<0&&u.data===t.data&&u.desc===t.desc);
    if(j>=0){ const liq=Math.round((-itens[j].valor-t.valor)*100)/100;
      const c=P.compras.find(c=>!usadosC.has(c.id)&&c.cartao===card&&Math.abs(c.valor-liq)<0.011&&diasEntre(c.data,t.data)<=3);
      if(c){ pre[i]=pre[j]=c.id; usadosC.add(c.id) } } } });
  // extrato: Pix no crédito entra na conta ("valor adicionado…") e sai no mesmo dia para a pessoa; o custo real vem na fatura do cartão
  const pixCred={};
  if(!isF) itens.forEach((t,i)=>{ if(t.valor>0&&/valor adicionado|pix no cr[eé]dito/i.test(t.desc||'')){ pixCred[i]=1;
    const j=itens.findIndex((u,k)=>!(k in pixCred)&&u.valor<0&&u.data===t.data&&Math.abs(u.valor+t.valor)<0.011); if(j>=0) pixCred[j]=1 } });
  return itens.map((t,i)=>{
    const v=Math.round(Math.abs(t.valor)*100)/100, saida=t.valor<0, d=t.desc||'';
    const r={...t,i,v,saida,onde:card,status:'novo'};
    if(i in pre) return {...r,status:'ok',motivo:'lançado junto com o estorno (valor líquido)',ref:pre[i]};
    if(/pagamento recebido|pagamento de fatura|^pagamento$/i.test(d)) return {...r,status:'ignorar',motivo:'pagamento de fatura'};
    if(!isF&&(i in pixCred||/valor adicionado|pix no cr[eé]dito/i.test(d))) return {...r,status:'ignorar',motivo:'Pix no crédito: o custo de verdade vem na fatura do cartão'};
    if(saida){
      const fat=Calc.absMes({data:t.data},fech);
      if(isF){
        const ativos=P.fixos.filter(f=>f.onde===card&&f.ini!=null&&f.ini<=fat&&fat<=f.fim);
        const fx=ativos.find(f=>Math.abs(valConta(f,fat)-v)<0.05&&nomeParecido(d,nomesDoFixo(f)))||ativos.find(f=>Math.abs(valConta(f,fat)-v)<0.05)
          ||ativos.find(f=>nomeParecido(d,nomesDoFixo(f))&&Math.abs(valConta(f,fat)-v)<=Math.max(1,valConta(f,fat)*0.1));
        if(fx) return {...r,status:'fixo',motivo:'já está em Fixos e parcelas: '+fx.desc};
        if(/parcela\s*\d+\s*\/\s*\d+/i.test(d)) return {...r,status:'parcela',motivo:'parcela sem cadastro: cadastre em Fixos e parcelas'};
      }
      const c=P.compras.find(c=>!usadosC.has(c.id)&&c.cartao===card&&Math.abs(c.valor-v)<0.011&&(c.data?diasEntre(c.data,t.data)<=3:c.fat===fat));
      if(c){ usadosC.add(c.id); return {...r,status:'ok',motivo:'lançado como: '+c.desc,ref:c.id} }
      if(!isF){ const am=Calc.absMes({data:t.data},null);
        const pg=quemDivide(d,am).filter(x=>x.f.onde===C3);   // Pix para quem tem a dívida no cartão (Cartão de 3º)
        if(pg.length){ const x=pg[0], esp=x.f.sua; const bate=Math.abs(esp-v)<=Math.max(1,esp*0.05);
          return {...r,status:'fixo',motivo:`pagamento para ${x.p}: “${x.f.desc}” (Cartão de 3º, ${money(esp)}/mês)${bate?'':' · valor diferente do esperado'} · já está nos fixos`} } }
      return {...r,kind:'compras',cat:adivinharCat(d)};
    }
    if(isF) return {...r,kind:'entradas',cat:'Estorno de compra',motivo:'crédito na fatura (estorno)'};
    const e=P.entradas.find(e=>!usadosE.has(e.id)&&Math.abs((nn(e.total)!=null?e.total:e.cheio)-v)<0.011&&(e.data?diasEntre(e.data,t.data)<=3:true));
    if(e){ usadosE.add(e.id); return {...r,status:'ok',motivo:'lançado como: '+e.desc,ref:e.id} }
    const am=Calc.absMes({data:t.data},null);
    const partes=quemDivide(d,am).filter(x=>x.f.onde!==C3&&x.f.volta>0.004);   // Pix de quem divide uma compra com você
    if(partes.length){ const p=partes[0].p, fs=[...new Set(partes.map(x=>x.f))]; const esp=fs.reduce((s,f)=>s+parteDe(f),0);
      // bate se o valor for uma combinação de partes (ex.: 2 partes dos Ensaios + 1 da Sapucaí), até as partes que voltam de cada compra
      const combina=(i,resto)=>{ if(Math.abs(resto)<=1) return true; if(i>=fs.length||resto<0) return false; const f=fs[i], pa=parteDe(f), max=Math.max(1,Number(f.voltam)||Math.max(1,(Number(f.dividir)||1)-1));
        for(let k=0;k<=max;k++){ if(combina(i+1,resto-k*pa)) return true } return false };
      const bate=v>1&&combina(0,v);
      const lista=fs.map(f=>'“'+f.desc+'” ('+money(parteDe(f))+')').join(' e ');
      if(bate) return {...r,status:'parte',motivo:`parte de ${p} em ${lista}: já volta sozinha em “volta p/ você”`};
      return {...r,kind:'entradas',cat:'Estorno de amigos',motivo:`${p} divide ${lista} com você, mas o valor não bate com as partes: se for outra coisa, marque para lançar`} }
    return {...r,kind:'entradas',cat:'Estorno de amigos'};
  });
}

const ITENS_PADRAO=[['antes','Hospedagem'],['antes','Passagem'],['antes','Ingressos / passeios'],['antes','Outros'],['durante','Transporte / Uber'],['durante','Alimentação'],['durante','Rolês / extras'],['durante','Reserva p/ imprevistos']];
const tripSave={};
function saveTrip(t){ clearTimeout(tripSave[t.id]); const i=S.viagens.findIndex(x=>x.id===t.id); if(i>=0) S.viagens[i]=t; tripSave[t.id]=setTimeout(()=>{ const o={...t}; delete o.id; put(COLS.viagens,t.id,o).then(ok=>ok&&setStatus('salvo')) },600) }
function vViagens(main){
  const trips=S.viagens.slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  main.innerHTML=`<div class="view"><div class="panel-head"><div><h2>Viagens</h2><p class="note">Planejamento: não entra nos gastos dos meses. “Dividir entre” vale para cada item; use 1 para o que é só seu.</p></div><button class="primary" id="nt">+ Nova viagem</button></div>
   ${trips.length?'':'<div class="panel empty">Nenhuma viagem. Crie uma para estimar hospedagem, passagem e gastos durante a viagem.</div>'}<div id="trips" class="view"></div></div>`;
  const box=$('#trips');
  trips.forEach(t=>{ const sec=document.createElement('section'); sec.className='panel trip'; box.appendChild(sec); drawTrip(sec,t) });
  $('#nt').onclick=async()=>{ const t={nome:'Nova viagem',onde:'',ordem:Date.now(),itens:ITENS_PADRAO.map(([s,n])=>({secao:s,nome:n,est:null,gasto:null,div:1}))}; await put(COLS.viagens,newId('v'),t) };

function drawTrip(sec,t0){
  const t=JSON.parse(JSON.stringify(t0)); t.itens=t.itens||[];
  const tot=(f)=>t.itens.reduce((s,i)=>s+(f(i)||0),0);
  const est=tot(i=>i.est), gas=tot(i=>i.gasto), sEst=tot(i=>i.est/Math.max(1,i.div||1)), sGas=tot(i=>(i.gasto||0)/Math.max(1,i.div||1));
  const rowI=(i,k)=>`<tr><td><input data-k="nome" data-i="${k}" value="${esc(i.nome)}" aria-label="Item"></td><td class="r"><input data-k="est" data-i="${k}" inputmode="decimal" value="${i.est??''}" aria-label="Estimado"></td><td class="r"><input data-k="gasto" data-i="${k}" inputmode="decimal" value="${i.gasto??''}" class="${i.gasto>i.est&&i.est>0?'cell-bad':''}" aria-label="Gasto"></td><td class="r"><input class="n" data-k="div" data-i="${k}" inputmode="numeric" value="${i.div??1}" aria-label="Dividir entre"></td><td class="r num">${money((i.est||0)/Math.max(1,i.div||1))}</td><td class="r num">${i.gasto!=null?money(i.gasto/Math.max(1,i.div||1)):''}</td><td><button class="link" data-x="${k}" aria-label="Remover item">×</button></td></tr>`;
  const part=s=>t.itens.map((i,k)=>[i,k]).filter(([i])=>i.secao===s).map(([i,k])=>rowI(i,k)).join('');
  sec.innerHTML=`<div class="panel-head"><input data-t="nome" value="${esc(t.nome)}" style="font-family:var(--f-display);font-weight:800;font-size:16px;flex:1 1 200px" aria-label="Nome da viagem"><input data-t="onde" value="${esc(t.onde)}" placeholder="quando / onde" style="flex:1 1 160px" aria-label="Quando e onde"><button class="danger" data-del>Apagar viagem</button></div>
   <div class="kpis"><div class="kpi"><div class="lbl">Total estimado</div><div class="val num">${money(est)}</div></div><div class="kpi"><div class="lbl">Sua parte (estimada)</div><div class="val num">${money(sEst)}</div></div>
   <div class="kpi"><div class="lbl">Gasto até agora</div><div class="val num">${money(gas)}</div></div><div class="kpi"><div class="lbl">Sua parte (gasto)</div><div class="val num">${money(sGas)}</div></div>
   <div class="kpi"><div class="lbl">Saldo (sua parte)</div><div class="val num ${sEst-sGas<0?'neg':'pos'}">${money(sEst-sGas)}</div></div></div>
   <div class="scroll"><table><thead><tr><th>Item</th><th class="r">Estimado</th><th class="r">Gasto</th><th class="r">Dividir entre</th><th class="r">Sua parte (est.)</th><th class="r">Sua parte (gasto)</th><th></th></tr></thead><tbody>
   <tr class="sec"><td colspan="7">Antes de ir</td></tr>${part('antes')}<tr><td colspan="7"><button class="link" data-add="antes">+ item antes de ir</button></td></tr>
   <tr class="sec"><td colspan="7">Durante a viagem</td></tr>${part('durante')}<tr><td colspan="7"><button class="link" data-add="durante">+ item durante a viagem</button></td></tr>
   <tr class="tot"><td>Total</td><td class="r num">${money(est)}</td><td class="r num">${money(gas)}</td><td></td><td class="r num">${money(sEst)}</td><td class="r num">${money(sGas)}</td><td></td></tr></tbody></table></div>
   <label class="note">Observações<textarea data-t="obs" rows="2" style="width:100%">${esc(t.obs)}</textarea></label>`;
  sec.querySelectorAll('input[data-k]').forEach(inp=>inp.addEventListener('change',()=>{ const k=Number(inp.dataset.i), f=inp.dataset.k; let v=inp.value;
    if(f==='est'||f==='gasto'){ v=parseMoney(v); if(Number.isNaN(v)){ toast('Valor inválido'); return } } else if(f==='div'){ v=Math.max(1,parseInt(v)||1) }
    t.itens[k][f]=v; saveTrip(t); drawTrip(sec,t) }));
  sec.querySelectorAll('[data-t]').forEach(inp=>inp.addEventListener('change',()=>{ t[inp.dataset.t]=inp.value; saveTrip(t) }));
  sec.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ t.itens.push({secao:b.dataset.add,nome:'Novo item',est:null,gasto:null,div:1}); saveTrip(t); drawTrip(sec,t) });
  sec.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ t.itens.splice(Number(b.dataset.x),1); saveTrip(t); drawTrip(sec,t) });
  const bd=sec.querySelector('[data-del]'); bd.onclick=()=>{ if(bd.dataset.c){ del(COLS.viagens,t.id) } else { bd.dataset.c='1'; bd.textContent='Confirmar: apagar viagem' } };
}

  main.querySelectorAll('[data-y]').forEach(cb=>cb.onchange=async()=>{ const set=new Set(P.cfg.anosTrancados||[]); cb.checked?set.add(Number(cb.dataset.y)):set.delete(Number(cb.dataset.y)); const cc={...S.config,anosTrancados:[...set].sort()}; if(await put('config','geral',cc)) toast(cb.checked?'Ano trancado':'Ano destrancado') });

async function baixar(nome,txt,tipo){
  const blob=txt instanceof Blob?txt:new Blob([txt],{type:tipo}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000);
}

/* ===================== PLANILHA .XLSX (valores calculados) ===================== */
function carregarXlsxLib(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>ok(window.XLSX); s.onerror=()=>ko(new Error('biblioteca da planilha não carregou')); document.head.appendChild(s) });
}
function serialData(s){ const d=pd(s); if(!d) return null; return (Date.UTC(d.y,d.m-1,d.d)-Date.UTC(1899,11,30))/86400000 }
function montarAbas(){ // devolve [{nome, linhas, larguras, moeda:[colunas], data:[colunas], titulo:[linhas em negrito]}]
  const abas=[]; const cards=(P.cfg.cartoes||[]).map(c=>c.nome); const r2=v=>v==null||isNaN(v)?null:Math.round(v*100)/100;
  // LEIA-ME
  abas.push({nome:'LEIA-ME',larguras:[110],linhas:[
    ['Só Se Vive Uma Vez: Sem Parar no Serasa · planilha exportada em '+new Date().toLocaleDateString('pt-BR')],[''],
    ['Esta planilha traz os valores já calculados pelo painel (sem fórmulas): abas de cada ano, compras, fixos e parcelas, entradas, cofrinho, viagens e cartões.'],
    ['Os meses das abas dos anos são meses de FATURA (pelo dia de fechamento de cada cartão), como no painel.'],
    ['Para voltar a ter a planilha completa, com fórmulas que recalculam sozinhas, baixe também "Tudo (.json)" no painel e peça ao Claude para gerar a planilha a partir dele.']]});
  // anos
  anosDisponiveis().forEach(y=>{
    const ms=Calc.ano(P,y); const has=ms.some(x=>x.in||x.out||x.totCompras); if(!has) return;
    const L=[['FINANÇAS '+y+' · detalhado'],['',...MESES.map(m=>m.charAt(0)+m.slice(1).toLowerCase()),'TOTAL']];
    const tit=[0,1]; const row=(lbl,fn,bold)=>{ const v=ms.map(x=>r2(fn(x))); L.push([lbl,...v,r2(v.reduce((s,a)=>s+(a||0),0))]); if(bold) tit.push(L.length-1) };
    const sec=t=>{ L.push([t]); tit.push(L.length-1) };
    sec('ENTRADAS'); row('Vovó',x=>x.vovo); row('Mãe',x=>x.mae); row('Bolsa(s)',x=>x.bolsa); row('Extras (entradas únicas)',x=>x.extras); row('Recebimentos parcelados',x=>x.receb); row('Estornos (amigos, compras e partes dos outros)',x=>x.estornos); row('SOMA IN',x=>x.in,1);
    sec('SAÍDAS'); row('Fixos e parcelas (valor cheio)',x=>x.fixos); cards.forEach(n=>row(n+' · compras',x=>x.cards[n])); row("Cartão de 3º (sua parte)",x=>x.c3); row('Empréstimos',x=>x.loan); row('SOMA OUT',x=>x.out,1); row('DIFERENÇA (sobrou)',x=>x.dif_,1);
    row('Cofrinho · depositado',x=>x.cofre); row('Cofrinho · planejado pelas metas',x=>x.cofreP);
    sec('FATURA DOS CARTÕES'); cards.filter(n=>!imediato(n)).forEach(n=>{ row(n+': fatura (compras + fixos)',x=>x.fat[n]); row('   falta pagar',x=>x.falta[n]); row('   fatura do app',x=>x.app[n]); row('   diferença (falta pagar − app)',x=>x.dif[n]) });
    row('A cobrar dos outros',x=>x.cobrar);
    sec('COMPRAS POR CATEGORIA'); (P.cfg.catCompra||[]).forEach(k=>row(k,x=>x.cat[k])); row('Sem categoria',x=>x.semCat); row('TOTAL DAS COMPRAS',x=>x.totCompras,1); row('Sem cartão marcado',x=>x.semCartao);
    sec('FIXOS E PARCELAS POR TIPO (valor cheio)'); (P.cfg.tipos||[]).forEach(k=>row(k,x=>x.tipo[k])); row('TOTAL DO CADASTRO',x=>x.totCad,1);
    sec('ENTRADAS POR CATEGORIA'); (P.cfg.catEntrada||[]).forEach(k=>row(k,x=>x.catE[k]));
    abas.push({nome:String(y),linhas:L,larguras:[44,...Array(13).fill(12)],moeda:[...Array(13).keys()].map(i=>i+1),titulo:tit,congelar:true});
  });
  // compras
  const cs=P.compras.slice().sort((a,b)=>(a.fat-b.fat)||String(a.data||'').localeCompare(String(b.data||''))||((a.ordem||0)-(b.ordem||0)));
  abas.push({nome:'COMPRAS',larguras:[11,40,16,18,12,12,8,18],moeda:[4],data:[0],titulo:[0],congelar:true,linhas:[['DATA','DESCRIÇÃO','CARTÃO','CATEGORIA','VALOR','MÊS (à mão)','ANO','FATURA'],
    ...cs.map(c=>[serialData(c.data),c.desc||'',c.cartao||'',c.cat||'',r2(c.valor),c.mes?MESES[c.mes-1]:'',c.mes?(c.ano||''):'',mtxt(c.fat)])]});
  // fixos
  const fs=P.fixos.slice().sort((a,b)=>(a.ini-b.ini)||((a.ordem||0)-(b.ordem||0)));
  abas.push({nome:'FIXOS E PARCELAS',larguras:[40,14,16,11,7,13,13,16,9,9,26,14,18,13,13,13,18,18],moeda:[5,6,13,14,15],data:[3],titulo:[0],congelar:true,linhas:[['DESCRIÇÃO','TIPO','ONDE','DATA (1ª)','VEZES','VALOR TOTAL','PARCELA','1ª FATURA (à mão)','DIVIDIR','VOLTAM','COM QUEM','DE TERCEIRO','ÚLTIMA COBRANÇA','POR MÊS (cheio)','SUA PARTE','VOLTA P/ VOCÊ','1ª FATURA','ÚLTIMA'],
    ...fs.map(f=>[f.desc||'',f.tipo||'',f.onde||'',serialData(f.data),f.vezes||'',r2(f.total),r2(f.parcela),f.mes?MESES[f.mes-1]+' '+(f.ano||''):'',f.dividir||'',f.voltam??'',f.pessoas||'',f.terceiro||'',f.ultMes?MESES[f.ultMes-1]+' '+(f.ultAno||''):'',r2(f.cheio),r2(f.sua),r2(f.volta),mtxt(f.ini),mtxt(f.fim)])]});
  // entradas
  const es=P.entradas.slice().sort((a,b)=>(a.ini-b.ini)||String(a.data||'').localeCompare(String(b.data||'')));
  abas.push({nome:'ENTRADAS',larguras:[11,36,22,20,7,13,13,13,18,18],moeda:[5,6,7],data:[0],titulo:[0],congelar:true,linhas:[['DATA','DESCRIÇÃO','DE QUEM','CATEGORIA','VEZES','VALOR TOTAL','POR MÊS (informado)','POR MÊS (calculado)','1º MÊS','ÚLTIMO MÊS'],
    ...es.map(e=>[serialData(e.data),e.desc||'',e.deQuem||'',e.cat||'',e.vezes||'',r2(e.total),r2(e.parcela),r2(e.cheio),mtxt(e.ini),mtxt(e.fim)])]});
  // cofrinho
  const guard=n=>P.deps.filter(d=>d.meta===n).reduce((s,d)=>s+(d.valor||0),0);
  const cof=[['METAS'],['META','VALOR','INÍCIO','FIM','MESES','GUARDAR/MÊS','JÁ GUARDADO','FALTA']];
  P.metas.forEach(m=>cof.push([m.nome,r2(m.valor),mtxt(m.ini),mtxt(m.fim),m.meses||'',r2(m.porMes),r2(guard(m.nome)),r2(Math.max(0,m.valor-guard(m.nome)))]));
  cof.push([''],['DEPÓSITOS'],['META','MÊS','ANO','VALOR']); const t2=cof.length-1;
  P.deps.slice().sort((a,b)=>(a.ano*12+a.mes)-(b.ano*12+b.mes)).forEach(d=>cof.push([d.meta,MESES[d.mes-1],d.ano,r2(d.valor)]));
  abas.push({nome:'COFRINHO',larguras:[26,13,16,16,8,13,13,13],moeda:[1,5,6,7],titulo:[0,1,t2-1,t2],linhas:cof});
  // viagens
  const vi=[]; const vt=[];
  S.viagens.slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0)).forEach(t=>{
    vi.push([t.nome||'Viagem',t.onde||'']); vt.push(vi.length-1);
    vi.push(['SEÇÃO','ITEM','ESTIMADO','GASTO','DIVIDIR ENTRE','SUA PARTE (est.)','SUA PARTE (gasto)']); vt.push(vi.length-1);
    let e=0,g=0,se=0,sg=0; (t.itens||[]).forEach(i=>{ const dv=Math.max(1,i.div||1); e+=i.est||0; g+=i.gasto||0; se+=(i.est||0)/dv; sg+=(i.gasto||0)/dv;
      vi.push([i.secao==='durante'?'Durante':'Antes',i.nome||'',r2(i.est),r2(i.gasto),dv,r2((i.est||0)/dv),i.gasto==null?null:r2(i.gasto/dv)]) });
    vi.push(['TOTAL','',r2(e),r2(g),'',r2(se),r2(sg)]); vt.push(vi.length-1);
    if(t.obs) vi.push(['Obs.:',t.obs]); vi.push(['']);
  });
  abas.push({nome:'VIAGENS',larguras:[12,30,13,13,13,16,16],moeda:[2,3,5,6],titulo:vt,linhas:vi.length?vi:[['Nenhuma viagem cadastrada.']]});
  // cartões
  abas.push({nome:'CARTÕES',larguras:[22,18],titulo:[0],linhas:[['CARTÃO','DIA DE FECHAMENTO'],...(P.cfg.cartoes||[]).map(c=>[c.nome,c.fech||'sem fechamento (mês da data)'])]});
  return abas;
}
async function gerarXlsx(){
  const X=await carregarXlsxLib(); const wb=X.utils.book_new();
  montarAbas().forEach(a=>{
    const ws=X.utils.aoa_to_sheet(a.linhas);
    ws['!cols']=(a.larguras||[]).map(w=>({wch:w}));
    const ref=X.utils.decode_range(ws['!ref']||'A1');
    for(let R=ref.s.r;R<=ref.e.r;R++){ if((a.titulo||[]).includes(R)) continue;
      (a.moeda||[]).forEach(C=>{ const c=ws[X.utils.encode_cell({r:R,c:C})]; if(c&&c.t==='n') c.z='"R$" #,##0.00' });
      (a.data||[]).forEach(C=>{ const c=ws[X.utils.encode_cell({r:R,c:C})]; if(c&&c.t==='n') c.z='dd/mm/yyyy' }); }
    X.utils.book_append_sheet(wb,ws,a.nome.slice(0,31));
  });
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
window.FIN.gerarXlsx=gerarXlsx; window.FIN.montarAbas=montarAbas;

start();
