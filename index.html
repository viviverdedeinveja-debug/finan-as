<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
"use strict";
/* ===================== REGRAS (mesma lógica da planilha) ===================== */
const MESES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MES_CURTO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const PAG='Pagamento de fatura', C3='Cartão de 3º', ATE=999999;
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>v==null||isNaN(v)?'—':brl.format(v);
const mtxt=a=>a==null?'':(a>=ATE?'até cancelar':MESES[(a-1)%12]+' '+Math.floor((a-1)/12));
const mshort=a=>a==null?'':(a>=ATE?'até cancelar':MES_CURTO[(a-1)%12]+'/'+String(Math.floor((a-1)/12)).slice(2));
function pd(s){ if(!s) return null; const p=String(s).split('-').map(Number); return p.length===3&&p[0]?{y:p[0],m:p[1],d:p[2]}:null }
function fmtD(s){ const d=pd(s); return d?String(d.d).padStart(2,'0')+'/'+String(d.m).padStart(2,'0')+'/'+d.y:'' }
function nn(v){ return typeof v==='number'&&!isNaN(v)?v:null }

const Calc={
  fech(cfg,nome){ const c=(cfg.cartoes||[]).find(c=>c.nome===nome); return c&&c.fech?Number(c.fech):null },
  absMes(r,fech){
    const d=pd(r.data);
    if(r.mes){ const y=r.ano||(d?d.y:null); return y?y*12+Number(r.mes):null }
    if(!d) return null;
    return d.y*12+d.m+(fech&&d.d>=fech?1:0);
  },
  compra(c,cfg){ return {...c, fat: nn(c.valor)==null?null:Calc.absMes(c,Calc.fech(cfg,c.cartao))} },
  fixo(f,cfg){
    const vazio=nn(f.total)==null&&nn(f.parcela)==null;
    if(vazio) return {...f,ini:null,fim:null,cheio:0,sua:0,volta:0};
    const ini=Calc.absMes(f,Calc.fech(cfg,f.onde));
    let fim=null;
    if(ini!=null){
      if(f.ultMes){ fim=(f.ultAno||Math.floor((ini-1)/12))*12+Number(f.ultMes) }
      else if(!f.vezes){ fim=f.tipo==='Empréstimo'?ini:((f.tipo==='Assinatura'||f.tipo==='Conta fixa')?ATE:Math.floor((ini-1)/12)*12+12) }
      else fim=ini+Math.max(1,f.vezes)-1;
    }
    const cheio=nn(f.total)!=null?(f.vezes?f.total/Math.max(1,f.vezes):f.total):f.parcela;
    const div=Math.max(1,Number(f.dividir)||0);
    const sua=f.terceiro?0:cheio/div;
    const volta=f.terceiro?cheio:(f.voltam==null||f.voltam===''?cheio-sua:cheio*Number(f.voltam)/div);
    return {...f,ini,fim,cheio,sua,volta};
  },
  entrada(e){
    const vazio=nn(e.total)==null&&nn(e.parcela)==null;
    if(vazio) return {...e,ini:null,fim:null,cheio:0,dest:null};
    const ini=Calc.absMes(e,null);
    const fim=ini==null?null:(e.vezes?ini+Math.max(1,e.vezes)-1:Math.floor((ini-1)/12)*12+12);
    const cheio=nn(e.total)!=null?(e.vezes?e.total/Math.max(1,e.vezes):e.total):e.parcela;
    const c=e.cat; const dest=c==='Bolsa'?'B':c==='Entrada única'?'U':c==='Entrada parcelada'?'P':(c==='Estorno de amigos'||c==='Estorno de compra')?'E':(Number(e.vezes)===1?'U':'P');
    return {...e,ini,fim,cheio,dest};
  },
  meta(m){ const ini=m.iniAno&&m.iniMes?m.iniAno*12+m.iniMes:null, fim=m.fimAno&&m.fimMes?m.fimAno*12+m.fimMes:null;
    return {...m,ini,fim,meses:ini&&fim?fim-ini+1:null,porMes:ini&&fim?m.valor/Math.max(1,fim-ini+1):null} },
  prep(S){ // aplica as regras a tudo
    const cfg=S.config;
    return { cfg,
      compras:S.compras.map(c=>Calc.compra(c,cfg)),
      fixos:S.fixos.map(f=>Calc.fixo(f,cfg)),
      entradas:S.entradas.map(Calc.entrada),
      metas:S.metas.map(Calc.meta), deps:S.deps, anos:S.anos };
  },
  mes(P,a,extra){ // tudo de um mês absoluto
    const y=Math.floor((a-1)/12), m=a-y*12, yd=P.anos[y]||{};
    const noMes=f=>{ const p=f.pagos&&f.pagos[a]; if(p&&nn(p.valor)!=null&&f.cheio){ const k=p.valor/f.cheio; return {...f,cheio:p.valor,sua:f.sua*k,volta:f.volta*k} } return f }; // valor do mês informado (contas de consumo)
    const F=P.fixos.filter(f=>f.ini!=null&&f.ini<=a&&a<=f.fim).map(noMes).concat(extra&&extra.fixos?extra.fixos.filter(f=>f.ini<=a&&a<=f.fim):[]);
    const E=P.entradas.filter(e=>e.ini!=null&&e.ini<=a&&a<=e.fim).concat(extra&&extra.entradas?extra.entradas.filter(e=>e.ini<=a&&a<=e.fim):[]);
    const C=P.compras.filter(c=>c.fat===a).concat(extra&&extra.compras?extra.compras.filter(c=>c.fat===a):[]);
    const sum=(arr,fn)=>arr.reduce((s,x)=>s+(fn(x)||0),0);
    const r={a,y,m};
    r.vovo=nn((yd.vovo||[])[m-1])||0; r.mae=nn((yd.mae||[])[m-1])||0;
    r.bolsa=sum(E.filter(e=>e.dest==='B'),e=>e.cheio);
    r.extras=sum(E.filter(e=>e.dest==='U'),e=>e.cheio);
    r.receb=sum(E.filter(e=>e.dest==='P'),e=>e.cheio);
    r.estornos=sum(E.filter(e=>e.dest==='E'),e=>e.cheio)+sum(F.filter(f=>f.onde!==C3),f=>f.volta);
    r.in=r.vovo+r.mae+r.bolsa+r.extras+r.receb+r.estornos;
    r.fixos=sum(F.filter(f=>f.tipo!=='Empréstimo'&&f.onde!==C3),f=>f.cheio);
    r.cards={}; r.fat={}; r.falta={}; r.app={}; r.dif={};
    const cartoes=(P.cfg.cartoes||[]).map(c=>c.nome);
    cartoes.forEach(n=>{
      r.cards[n]=sum(C.filter(c=>c.cartao===n&&c.cat!==PAG),c=>c.valor);
      r.fat[n]=r.cards[n]+sum(F.filter(f=>f.onde===n),f=>f.cheio);
      r.falta[n]=r.fat[n]-sum(C.filter(c=>c.cartao===n&&c.cat===PAG),c=>c.valor);
      const ap=yd.app&&yd.app[n]?nn(yd.app[n][m-1]):null; r.app[n]=ap; r.dif[n]=ap==null?null:r.falta[n]-ap;
    });
    r.c3=sum(F.filter(f=>f.onde===C3),f=>f.sua);
    r.loan=sum(F.filter(f=>f.tipo==='Empréstimo'&&f.onde!==C3),f=>f.cheio);
    r.out=r.fixos+cartoes.reduce((s,n)=>s+r.cards[n],0)+r.c3+r.loan;
    r.dif_=r.in-r.out;
    r.cofre=sum(P.deps.filter(d=>Number(d.ano)===y&&Number(d.mes)===m),d=>d.valor);
    r.cofreP=sum(P.metas.filter(x=>x.ini&&x.ini<=a&&a<=x.fim),x=>x.porMes);
    r.cobrar=sum(F.filter(f=>f.onde!==C3),f=>f.volta);
    r.cat={}; (P.cfg.catCompra||[]).forEach(k=>r.cat[k]=sum(C.filter(c=>c.cat===k),c=>c.valor));
    r.totCompras=sum(C.filter(c=>c.cat!==PAG),c=>c.valor);
    r.semCat=r.totCompras-Object.values(r.cat).reduce((s,v)=>s+v,0);
    r.semCartao=r.totCompras-cartoes.reduce((s,n)=>s+r.cards[n],0);
    r.tipo={}; (P.cfg.tipos||[]).forEach(k=>r.tipo[k]=sum(F.filter(f=>f.tipo===k),f=>f.cheio));
    r.totCad=sum(F,f=>f.cheio);
    r.catE={}; (P.cfg.catEntrada||[]).forEach(k=>r.catE[k]=sum(E.filter(e=>e.cat===k),e=>e.cheio));
    return r;
  },
  ano(P,y,extra){ const ms=[]; for(let m=1;m<=12;m++) ms.push(Calc.mes(P,y*12+m,extra)); return ms }
};
window.FIN={Calc};

/* ===================== ESTADO E BANCO ===================== */
const DEF_CFG={cartoes:[{nome:'Nubank',fech:20},{nome:'Mercado Pago',fech:8},{nome:'Santander',fech:null},{nome:'Pix/Débito',fech:null}],
  catCompra:['iFood + Fome','Uber/99','Autocuidado','Rolês','Emergências','Extras'],
  catEntrada:['Entrada única','Entrada parcelada','Bolsa','Estorno de amigos','Estorno de compra','Trabalho / Serviço','Outros'],
  tipos:['Assinatura','Parcelamento','Conta fixa','Empréstimo','Outros'], ondeExtra:['Cartão de 3º','Boleto','Outro'], anosTrancados:[]};
const S={config:null,compras:[],fixos:[],entradas:[],metas:[],deps:[],viagens:[],anos:{},loaded:{},readOnly:false};
let db=null, P=null;
const COLS={compras:'compras',fixos:'fixos',entradas:'entradas',metas:'cofrinho_metas',deps:'cofrinho_dep',viagens:'viagens'};

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200) }
function setStatus(t){ document.getElementById('status').textContent=t }

/* Banco local (só para testar o painel fora do claude.ai) */
function memDb(seed){
  const store={}; const subs=[];
  Object.entries(seed).forEach(([col,docs])=>{ store[col]={}; Object.entries(docs).forEach(([id,d])=>store[col][id]=d) });
  const snapC=col=>({docs:Object.entries(store[col]||{}).map(([id,d])=>({id,exists:true,data:()=>d})),metadata:{fromCache:false}});
  const notify=col=>subs.filter(s=>s.col===col).forEach(s=>s.fn(s.doc?{id:s.doc,exists:!!(store[col]||{})[s.doc],data:()=>(store[col]||{})[s.doc],metadata:{fromCache:false}}:snapC(col)));
  const docRef=(col,id)=>({id,set:async d=>{(store[col]=store[col]||{})[id]=JSON.parse(JSON.stringify(d));notify(col)},delete:async()=>{delete (store[col]||{})[id];notify(col)},
    onSnapshot:(fn)=>{subs.push({col,doc:id,fn});setTimeout(()=>notify(col),0);return()=>{}}});
  return {collection:col=>({doc:id=>docRef(col,id||('l'+Math.random().toString(36).slice(2,10))),onSnapshot:fn=>{subs.push({col,fn});setTimeout(()=>fn(snapC(col)),0);return()=>{}}}),
          doc:path=>{const [c,i]=path.split('/');return docRef(c,i)}};
}

    track(db.collection(col)).onSnapshot(snap=>{ S[k]=snap.docs.map(d=>({id:d.id,...d.data()})); if(first){first=false;done()} refresh() },
      err=>{ setStatus('erro ao ler '+col+': '+(err&&err.code||'')); if(first){first=false;done()} }) });

const writing={};
async function put(col,id,data){
  if(S.readOnly){ toast('Você só pode ver este painel'); return false }
  const key=col+'/'+id; while(writing[key]) await writing[key];
  const p=(async()=>{ try{ await db.collection(col).doc(id).set(JSON.parse(JSON.stringify(data))); return true }catch(e){ toast('Não salvou: '+(e&&e.code==='permission-denied'?'sem permissão (confira as regras do Firestore)':'tente de novo')); return false } })();
  writing[key]=p; const r=await p; delete writing[key]; return r;
}
async function del(col,id){ try{ await db.collection(col).doc(id).delete(); return true }catch(e){ toast('Não apagou: tente de novo'); return false } }

  const money0=v=>brl.format(v).replace(/,\d\d$/,'');
  const scale={y:{ticks:{callback:v=>money0(v)},grid:{color:grid}},x:{grid:{display:false}}};
  const tip={callbacks:{label:c=>c.dataset.label+': '+brl.format(c.parsed.y??c.parsed)}};
  charts.c1=new Chart(document.getElementById('ch1'),{type:'bar',data:{labels,datasets:[
    {label:'Entrou',data:ms.map(x=>x.in),backgroundColor:css('--good'),order:2},
    {label:'Saiu',data:ms.map(x=>x.out),backgroundColor:css('--bad'),order:2},
    {label:'Sobrou',type:'line',data:ms.map(x=>x.dif_),borderColor:css('--accent'),backgroundColor:css('--accent'),pointRadius:3,tension:.25,order:1}]},
    options:{responsive:true,maintainAspectRatio:false,scales:scale,plugins:{tooltip:tip,legend:{position:'bottom'}}}});
  const cats=(P.cfg.catCompra||[]); const vals=cats.map(k=>ms.reduce((s,x)=>s+x.cat[k],0));
  const pal=['--nubank','--mp','--santander','--pix','--extra','--cofre','--accent','--warn'].map(css);
  charts.c2=new Chart(document.getElementById('ch2'),{type:'doughnut',data:{labels:cats,datasets:[{data:vals,backgroundColor:cats.map((_,i)=>pal[i%pal.length]),borderColor:css('--surface'),borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>{const t=vals.reduce((a,b)=>a+b,0)||1;return c.label+': '+brl.format(c.parsed)+' ('+Math.round(c.parsed/t*100)+'%)'}}}}}});
  charts.c3=new Chart(document.getElementById('ch3'),{type:'bar',data:{labels,datasets:cards.map((n,i)=>({label:n,data:ms.map(x=>x.fat[n]),backgroundColor:cardColor(n,i),stack:'f'})).concat([{label:'Cofrinho',type:'line',data:ms.map(x=>x.cofre),borderColor:css('--cofre'),backgroundColor:css('--cofre'),pointRadius:3}])},
    options:{responsive:true,maintainAspectRatio:false,scales:{...scale,x:{stacked:true,grid:{display:false}},y:{...scale.y,stacked:true}},plugins:{tooltip:tip,legend:{position:'bottom'}}}});
}

/* ===================== ANO DETALHADO ===================== */
function anoDoc(y){ const d=JSON.parse(JSON.stringify(S.anos[y]||{})); d.vovo=d.vovo||Array(12).fill(null); d.mae=d.mae||Array(12).fill(null); d.app=d.app||{}; d.orcamento=d.orcamento||{}; return d }
const anoSave={};
function saveAno(y,d){ clearTimeout(anoSave[y]); S.anos[y]=d; anoSave[y]=setTimeout(async()=>{ if(await put('anos',String(y),d)) setStatus('salvo') },500) }
function vAno(main){
  const y=selAno, ms=Calc.ano(P,y), cards=(P.cfg.cartoes||[]).map(c=>c.nome), lk=locked(y), d=anoDoc(y);
  const head=`<tr><th></th>${MES_CURTO.map((m,i)=>`<th class="r" ${i+1===selMes?'style="color:var(--accent)"':''}>${m}</th>`).join('')}<th class="r">Total</th><th class="r">Orçamento/mês</th></tr>`;
  const row=(lbl,fn,opt={})=>{ const vals=ms.map(fn); const t=vals.reduce((s,v)=>s+(v||0),0); const orc=opt.orc?nn(d.orcamento[opt.orc]):null;
    return `<tr class="${opt.tot?'tot':''} ${opt.hl?'hl':''}"><td>${lbl}</td>${vals.map(v=>`<td class="r num ${opt.sign?(v<0?'neg':'pos'):''} ${orc&&v>orc?'cell-bad':''}">${money(v)}</td>`).join('')}<td class="r num">${money(t)}</td><td class="r">${opt.orc?`<input type="text" inputmode="decimal" data-orc="${esc(opt.orc)}" value="${orc??''}" ${lk?'disabled':''} aria-label="Orçamento de ${esc(lbl)}">`:''}</td></tr>` };
  const inRow=(lbl,key)=>`<tr><td>${lbl} <span class="note">(digite)</span></td>${d[key].map((v,i)=>`<td class="r"><input type="text" inputmode="decimal" data-k="${key}" data-i="${i}" value="${v??''}" ${lk?'disabled':''} aria-label="${lbl} ${MES_CURTO[i]}"></td>`).join('')}<td class="r num">${money(d[key].reduce((s,v)=>s+(nn(v)||0),0))}</td><td></td></tr>`;
  const sec=t=>`<tr class="sec"><td colspan="15">${t}</td></tr>`;
  let h=`<div class="view"><section class="panel"><div class="panel-head"><h2>${y} detalhado</h2>${lk?'<span class="lock">ano trancado: lançamentos deste ano não podem ser alterados</span>':'<span class="note">Valores por mês da fatura. Campos com borda você digita aqui.</span>'}</div>
  <div class="scroll"><table class="ytab"><thead>${head}</thead><tbody>
  ${sec('Entradas')}${inRow('Vovó','vovo')}${inRow('Mãe','mae')}
  ${row('Bolsa(s)',x=>x.bolsa)}${row('Extras (entradas únicas)',x=>x.extras)}${row('Recebimentos parcelados',x=>x.receb)}${row('Estornos',x=>x.estornos)}${row('Entrou',x=>x.in,{tot:1})}
  ${sec('Saídas')}${row('Fixos e parcelas (valor cheio)',x=>x.fixos,{orc:'fixos'})}${cards.map(n=>row(esc(n)+' · compras',x=>x.cards[n],{orc:'card:'+n})).join('')}
  ${row("Cartão de 3º (sua parte)",x=>x.c3,{orc:'c3'})}${row('Empréstimos',x=>x.loan,{orc:'loan'})}${row('Saiu',x=>x.out,{tot:1})}${row('Sobrou',x=>x.dif_,{tot:1,sign:1})}
  ${row('Cofrinho · depositado',x=>x.cofre)}${row('Cofrinho · planejado pelas metas',x=>x.cofreP)}
  ${sec('Faturas')}${cards.map(n=>row(esc(n)+': fatura (compras + fixos)',x=>x.fat[n])+row('Falta pagar · '+esc(n),x=>x.falta[n],{hl:1})+
     `<tr><td>&nbsp;&nbsp;fatura do app <span class="note">(digite)</span></td>${ms.map((x,i)=>`<td class="r"><input type="text" inputmode="decimal" data-app="${esc(n)}" data-i="${i}" value="${x.app[n]??''}" ${lk?'disabled':''} aria-label="Fatura do app ${esc(n)} ${MES_CURTO[i]}"></td>`).join('')}<td></td><td></td></tr>`+
     `<tr><td>&nbsp;&nbsp;diferença</td>${ms.map(x=>`<td class="r num ${x.dif[n]==null?'':(Math.abs(x.dif[n])<=0.05?'cell-good':'cell-bad')}">${x.dif[n]==null?'':money(x.dif[n])}</td>`).join('')}<td></td><td></td></tr>`).join('')}
  ${row('A cobrar dos outros',x=>x.cobrar)}
  ${sec('Compras por categoria')}${(P.cfg.catCompra||[]).map(k=>row(esc(k),x=>x.cat[k],{orc:'cat:'+k})).join('')}${row('Sem categoria',x=>x.semCat)}${row('Total das compras',x=>x.totCompras,{tot:1})}${row('Sem cartão marcado',x=>x.semCartao)}
  ${sec('Fixos e parcelas por tipo')}${(P.cfg.tipos||[]).map(k=>row(esc(k),x=>x.tipo[k])).join('')}${row('Total do cadastro (valor cheio)',x=>x.totCad,{tot:1})}
  ${sec('Entradas por categoria')}${(P.cfg.catEntrada||[]).map(k=>row(esc(k),x=>x.catE[k])).join('')}
  </tbody></table></div><p class="note">Orçamento: o valor do mês fica vermelho quando passa do orçamento. Diferença da fatura em verde quando bate com o app.</p></section></div>`;
  main.innerHTML=h;
  main.querySelectorAll('input[data-k]').forEach(inp=>inp.addEventListener('change',()=>{ const v=parseMoney(inp.value); if(Number.isNaN(v)){toast('Valor inválido');return} const dd=anoDoc(y); dd[inp.dataset.k][Number(inp.dataset.i)]=v; saveAno(y,dd); refresh() }));
  main.querySelectorAll('input[data-app]').forEach(inp=>inp.addEventListener('change',()=>{ const v=parseMoney(inp.value); if(Number.isNaN(v)){toast('Valor inválido');return} const dd=anoDoc(y); const n=inp.dataset.app; dd.app[n]=dd.app[n]||Array(12).fill(null); dd.app[n][Number(inp.dataset.i)]=v; saveAno(y,dd); refresh() }));
  main.querySelectorAll('input[data-orc]').forEach(inp=>inp.addEventListener('change',()=>{ const v=parseMoney(inp.value); if(Number.isNaN(v)){toast('Valor inválido');return} const dd=anoDoc(y); if(v==null) delete dd.orcamento[inp.dataset.orc]; else dd.orcamento[inp.dataset.orc]=v; saveAno(y,dd); refresh() }));
}
</script>
<script>
"use strict";
/* ===================== LANÇAMENTOS ===================== */
function chipCard(n){ const i=(P.cfg.cartoes||[]).findIndex(c=>c.nome===n); return n?`<span class="chip ${i>=0?'card':''}" style="${i>=0?'background:'+cardColor(n,i):''}">${esc(n)}</span>`:'<span class="cell-bad">sem cartão</span>' }
function vLanc(main){
  const y=selAno, a=y*12+selMes;
  const filtTxt=r=>!lancBusca||JSON.stringify(r).toLowerCase().includes(lancBusca.toLowerCase());
  const inPeriod=(ini,fim)=>lancTodoAno?(ini!=null&&ini<=y*12+12&&fim>=y*12+1):(ini!=null&&ini<=a&&a<=fim);
  let list=[], cols='', body='';
  if(lancTab==='compras'){
    list=P.compras.filter(c=>(lancTodoAno?Math.floor((c.fat-1)/12)===y:c.fat===a)&&filtTxt(c)).sort((p,q)=>(p.fat-q.fat)||String(p.data||'').localeCompare(String(q.data||''))||((p.ordem||0)-(q.ordem||0)));
    cols='<th>Data</th><th>Descrição</th><th>Cartão</th><th>Categoria</th><th class="r">Valor</th><th>Fatura</th>';
    body=list.map(c=>`<tr class="click" data-id="${c.id}"><td class="num">${fmtD(c.data)||'<span class="note">'+mshort(c.fat)+'</span>'}</td><td>${esc(c.desc)}</td><td>${chipCard(c.cartao)}</td><td>${c.cat?esc(c.cat):'<span class="cell-bad">sem categoria</span>'}</td><td class="r num">${money(c.valor)}</td><td class="note">${mshort(c.fat)}</td></tr>`).join('');
  } else if(lancTab==='fixos'){
    list=P.fixos.filter(f=>inPeriod(f.ini,f.fim)&&filtTxt(f)).sort((p,q)=>(p.ini-q.ini)||((p.ordem||0)-(q.ordem||0)));
    cols='<th>Descrição</th><th>Tipo</th><th>Onde</th><th class="r">Por mês</th><th>Período</th><th class="r">Sua parte</th><th class="r">Volta p/ você</th>';
    body=list.map(f=>`<tr class="click" data-id="${f.id}"><td>${esc(f.desc)}${f.dividir?` <span class="chip">÷${f.dividir}${f.voltam!=null&&f.voltam!==''?' · voltam '+f.voltam:''}</span>`:''}${f.terceiro?` <span class="chip">de ${esc(f.terceiro)}</span>`:''}</td><td>${esc(f.tipo||'')}</td><td>${chipCard(f.onde)}</td><td class="r num">${money(f.cheio)}</td><td class="note">${mshort(f.ini)} → ${mshort(f.fim)}${f.vezes?' ('+f.vezes+'x)':''}</td><td class="r num">${money(f.sua)}</td><td class="r num">${f.volta?money(f.volta):''}</td></tr>`).join('');
  } else {
    list=P.entradas.filter(e=>inPeriod(e.ini,e.fim)&&filtTxt(e)).sort((p,q)=>(p.ini-q.ini)||String(p.data||'').localeCompare(String(q.data||'')));
    cols='<th>Data</th><th>Descrição</th><th>De quem</th><th>Categoria</th><th class="r">Por mês</th><th>Período</th>';
    body=list.map(e=>`<tr class="click" data-id="${e.id}"><td class="num">${fmtD(e.data)||'<span class="note">'+mshort(e.ini)+'</span>'}</td><td>${esc(e.desc)}</td><td>${esc(e.deQuem||'')}</td><td>${esc(e.cat||'')}</td><td class="r num">${money(e.cheio)}</td><td class="note">${e.ini===e.fim?mshort(e.ini):mshort(e.ini)+' → '+mshort(e.fim)}</td></tr>`).join('');
  }
  const total=lancTab==='compras'?list.filter(c=>c.cat!==PAG).reduce((s,c)=>s+c.valor,0):lancTab==='fixos'?list.reduce((s,f)=>s+f.sua,0):list.reduce((s,e)=>s+e.cheio,0);
  const nome={compras:'Compras',fixos:'Fixos e parcelas',entradas:'Entradas'}[lancTab];
  main.innerHTML=`<div class="view"><section class="panel">
   <div class="panel-head"><div class="subtabs" role="group" aria-label="Tipo de lançamento">
     ${['compras','fixos','entradas'].map(t=>`<button data-t="${t}" aria-pressed="${t===lancTab}">${{compras:'Compras',fixos:'Fixos e parcelas',entradas:'Entradas'}[t]}</button>`).join('')}</div>
     <button class="primary" id="btnNovo">+ ${lancTab==='compras'?'Nova compra':lancTab==='fixos'?'Novo fixo ou parcela':'Nova entrada'}</button></div>
   <div class="filters"><input type="search" id="busca" placeholder="Buscar (descrição, pessoa, cartão…)" value="${esc(lancBusca)}" aria-label="Buscar lançamentos">
     <label class="note"><input type="checkbox" id="todoAno" ${lancTodoAno?'checked':''}> o ano todo</label></div>
   <p class="note">${nome} ${lancTodoAno?'de '+y:'da fatura de '+MESES[selMes-1].toLowerCase()+' '+y} · ${list.length} ${list.length===1?'lançamento':'lançamentos'} · ${lancTab==='fixos'?'sua parte':'total'}: <b class="num">${money(total)}</b>${lancTab==='compras'?' (sem pagamentos de fatura)':''}</p>
   <div class="scroll">${list.length?`<table><thead><tr>${cols}</tr></thead><tbody>${body}</tbody></table>`:`<div class="empty">Nada aqui neste período. Use “${lancTab==='compras'?'Nova compra':lancTab==='fixos'?'Novo fixo ou parcela':'Nova entrada'}” para lançar.</div>`}</div>
  </section></div>`;
  main.querySelectorAll('.subtabs button').forEach(b=>b.addEventListener('click',()=>{ lancTab=b.dataset.t; render() }));
  const bus=$('#busca'); bus.addEventListener('input',()=>{ lancBusca=bus.value; clearTimeout(bus._t); bus._t=setTimeout(()=>{ render(); const nb=$('#busca'); nb.focus(); nb.setSelectionRange(nb.value.length,nb.value.length) },350) });
  $('#todoAno').addEventListener('change',e=>{ lancTodoAno=e.target.checked; render() });
  $('#btnNovo').addEventListener('click',()=>openForm(lancTab,null));
  main.querySelectorAll('tr.click').forEach(tr=>tr.addEventListener('click',()=>openForm(lancTab,tr.dataset.id)));
}

/* ---------- formulários ---------- */
function opts(arr,sel,blank){ return (blank?`<option value="">${blank}</option>`:'')+arr.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('') }
function mesOpts(sel){ return `<option value="">—</option>`+MESES.map((n,i)=>`<option value="${i+1}" ${Number(sel)===i+1?'selected':''}>${n}</option>`).join('') }
function closeModal(){ $('#modalRoot').innerHTML='' }
function openForm(kind,id,preset){
  const colKey={compras:'compras',fixos:'fixos',entradas:'entradas'}[kind];
  const rec=id?S[colKey].find(r=>r.id===id):null;
  const r=rec?{...rec}:{...(kind==='compras'?{data:new Date().toISOString().slice(0,10),cartao:(P.cfg.cartoes[0]||{}).nome}:kind==='fixos'?{tipo:'Parcelamento',onde:(P.cfg.cartoes[0]||{}).nome,data:new Date().toISOString().slice(0,10)}:{data:new Date().toISOString().slice(0,10),vezes:1,cat:'Estorno de amigos'}),...(preset||{})};
  const calc=kind==='compras'?Calc.compra(r,P.cfg):kind==='fixos'?Calc.fixo(r,P.cfg):Calc.entrada(r);
  const yr=a=>a?Math.floor((a-1)/12):null;
  const lk=rec&&(kind==='compras'?locked(yr(calc.fat)):locked(yr(calc.fim>=ATE?null:calc.fim)));
  const cartoes=(P.cfg.cartoes||[]).map(c=>c.nome);
  const mv=v=>v==null?'':String(v).replace('.',',');
  let f='';
  if(kind==='compras') f=`
    <label>Data<input type="date" name="data" value="${r.data||''}"></label>
    <label class="wide">Descrição<input name="desc" value="${esc(r.desc)}" required></label>
    <label>Cartão<select name="cartao">${opts(cartoes,r.cartao,'—')}</select></label>
    <label>Categoria<select name="cat">${opts((P.cfg.catCompra||[]).concat([PAG]),r.cat,'—')}</select></label>
    <label>Valor (R$)<input name="valor" inputmode="decimal" value="${mv(r.valor)}"></label>
    <details class="adv wide"><summary>Mês/ano da fatura à mão (opcional)</summary><div class="form">
      <label>Mês<select name="mes">${mesOpts(r.mes)}</select></label><label>Ano<input name="ano" inputmode="numeric" value="${r.ano??''}"></label></div>
      <p class="note">Vale por cima da data. Use para lançamentos sem data ou casos especiais.</p></details>`;
  else if(kind==='fixos') f=`
    <label class="wide">Descrição<input name="desc" value="${esc(r.desc)}"></label>
    <label>Tipo<select name="tipo">${opts(P.cfg.tipos||[],r.tipo)}</select></label>
    <label>Onde é cobrado<select name="onde">${opts(cartoes.concat(P.cfg.ondeExtra||[]),r.onde,'—')}</select></label>
    <label>Data da compra (1ª)<input type="date" name="data" value="${r.data||''}"></label>
    <label>Vezes<input name="vezes" inputmode="numeric" value="${r.vezes??''}" placeholder="vazio: ver dica"></label>
    <label>Valor total (R$)<input name="total" inputmode="decimal" value="${mv(r.total)}"></label>
    <label>ou valor da parcela (R$)<input name="parcela" inputmode="decimal" value="${mv(r.parcela)}"></label>
    <label>Vence no dia (contas da casa)<input name="dia" inputmode="numeric" value="${r.dia??''}" placeholder="ex.: 10"></label>
    <p class="note wide" style="grid-column:1/-1">Vezes vazio: assinatura e conta fixa (água, luz, internet…) cobram todo mês até você encerrar; empréstimo cobra uma vez. Contas fixas aparecem em “Contas da casa” no Resumo, com caixinha de pago.</p>
    <details class="adv wide" ${r.dividir||r.voltam!=null||r.terceiro||r.ultMes||r.mes?'open':''}><summary>Dividir com outras pessoas, 1ª fatura e encerramento</summary><div class="form">
      <label>Dividir entre (pessoas, contando você)<input name="dividir" inputmode="numeric" value="${r.dividir??''}"></label>
      <label>Partes que voltam em dinheiro<input name="voltam" inputmode="numeric" value="${r.voltam??''}" placeholder="vazio = todas"></label>
      <label class="wide">Com quem (anotação)<input name="pessoas" value="${esc(r.pessoas)}" placeholder="ex.: Stefane, Iarus, Ana Laura"></label>
      <label>De terceiro (nome)<input name="terceiro" value="${esc(r.terceiro)}" placeholder="compra inteira de outra pessoa"></label>
      <label>1ª fatura · mês<select name="mes">${mesOpts(r.mes)}</select></label><label>1ª fatura · ano<input name="ano" inputmode="numeric" value="${r.ano??''}"></label>
      <label>Última cobrança · mês<select name="ultMes">${mesOpts(r.ultMes)}</select></label><label>Última cobrança · ano<input name="ultAno" inputmode="numeric" value="${r.ultAno??''}"></label></div>
      <p class="note">Onde = Cartão de 3º: compra no cartão de outra pessoa; entra só a sua parte. De terceiro: entra cheia e volta inteira.</p></details>`;
  else f=`
    <label class="wide">Descrição<input name="desc" value="${esc(r.desc)}"></label>
    <label>De quem<input name="deQuem" value="${esc(r.deQuem)}"></label>
    <label>Data<input type="date" name="data" value="${r.data||''}"></label>
    <label>Categoria<select name="cat">${opts(P.cfg.catEntrada||[],r.cat)}</select></label>
    <label>Vezes<input name="vezes" inputmode="numeric" value="${r.vezes??''}"></label>
    <label>Valor total (R$)<input name="total" inputmode="decimal" value="${mv(r.total)}"></label>
    <label>ou valor por mês (R$)<input name="parcela" inputmode="decimal" value="${mv(r.parcela)}"></label>
    <details class="adv wide" ${r.mes?'open':''}><summary>Mês/ano à mão (opcional)</summary><div class="form"><label>Mês<select name="mes">${mesOpts(r.mes)}</select></label><label>Ano<input name="ano" inputmode="numeric" value="${r.ano??''}"></label></div></details>
    <p class="note" style="grid-column:1/-1">Bolsa: valor por mês e quantos meses. Partes dos amigos em parcelas divididas já voltam sozinhas; não lance de novo.</p>`;
  const title={compras:rec?'Editar compra':'Nova compra',fixos:rec?'Editar fixo ou parcela':'Novo fixo ou parcela',entradas:rec?'Editar entrada':'Nova entrada'}[kind];
  $('#modalRoot').innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
   <h2 id="mt">${title}</h2>${lk?'<p class="lock">Este lançamento é de um ano trancado. Destranque o ano em Cartões e ajustes para alterar.</p>':''}
   <form id="frm" class="form">${f}<div class="err" id="ferr"></div><p class="note wide" id="prev" style="grid-column:1/-1"></p></form>
   <div class="actions">${rec&&!lk?'<button class="danger left" id="bDel">Apagar</button>':''}<button id="bCancel">Cancelar</button>${lk?'':'<button class="primary" id="bSave">Salvar</button>'}</div></div></div>`;
  const frm=$('#frm');
  if(lk) frm.querySelectorAll('input,select').forEach(i=>i.disabled=true);
  const read=()=>{ const o={}; new FormData(frm).forEach((v,k)=>o[k]=v); const out={...(rec||{})}; delete out.id;
    ['desc','cartao','cat','tipo','onde','deQuem','terceiro','pessoas','data'].forEach(k=>{ if(k in o) out[k]=o[k].trim()||null });
    ['valor','total','parcela'].forEach(k=>{ if(k in o) out[k]=parseMoney(o[k]) });
    ['vezes','dividir','voltam','ano','ultAno','mes','ultMes','dia'].forEach(k=>{ if(k in o){ const t=String(o[k]).trim(); out[k]=t===''?null:Number(t) } });
    return out };
  const preview=()=>{ const o=read(); let t='';
    if(kind==='compras'){ const c=Calc.compra(o,P.cfg); t=c.fat?'Cai na fatura de '+mtxt(c.fat).toLowerCase()+'.':'' }
    else if(kind==='fixos'){ const x=Calc.fixo(o,P.cfg); if(x.ini) t=`${money(x.cheio)} por mês, de ${mtxt(x.ini).toLowerCase()} a ${mtxt(x.fim).toLowerCase()}. Sua parte: ${money(x.sua)}${x.volta?'; volta para você: '+money(x.volta):''}.` }
    else { const x=Calc.entrada(o); if(x.ini) t=`${money(x.cheio)} por mês, de ${mtxt(x.ini).toLowerCase()} a ${mtxt(x.fim).toLowerCase()}.` }
    $('#prev').textContent=t };
  frm.addEventListener('input',preview); preview();
  $('#bCancel').onclick=closeModal; $('#mbg').addEventListener('click',e=>{ if(e.target.id==='mbg') closeModal() });
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ closeModal(); document.removeEventListener('keydown',k) } });
  if($('#bSave')) $('#bSave').onclick=async()=>{
    const o=read(); const errs=[];
    if(kind==='compras'){ if(o.valor==null||Number.isNaN(o.valor)) errs.push('Digite o valor.'); if(!o.cartao) errs.push('Escolha o cartão.'); if(!o.cat) errs.push('Escolha a categoria.'); if(!o.data&&!(o.mes&&o.ano)) errs.push('Informe a data ou o mês e o ano.') }
    else { if((o.total==null||Number.isNaN(o.total))&&(o.parcela==null||Number.isNaN(o.parcela))) errs.push('Digite o valor total ou o da parcela.'); if(Number.isNaN(o.total)||Number.isNaN(o.parcela)) errs.push('Valor inválido.'); if(!o.data&&!(o.mes&&o.ano)) errs.push('Informe a data ou o mês e o ano.'); if(kind==='fixos'&&!o.onde) errs.push('Escolha onde é cobrado.') }
    if(!o.desc) errs.push('Digite uma descrição.');
    if(errs.length){ $('#ferr').textContent=errs.join(' '); return }
    const yy=kind==='compras'?Math.floor((Calc.compra(o,P.cfg).fat-1)/12):null; if(yy&&locked(yy)){ $('#ferr').textContent='Esse mês é de um ano trancado.'; return }
    if(!rec) o.ordem=Date.now();
    const col=COLS[colKey]; const nid=id||newId(kind[0]);
    if(await put(col,nid,clean(o))){ closeModal(); toast(rec?'Alteração salva':'Lançamento salvo') } };
  if($('#bDel')) $('#bDel').onclick=()=>{ const b=$('#bDel'); if(b.dataset.c){ del(COLS[colKey],id).then(ok=>{ if(ok){ closeModal(); toast('Apagado') } }) } else { b.dataset.c='1'; b.textContent='Confirmar: apagar de vez' } };
}

<script>
"use strict";
/* ===================== SIMULADOR ===================== */
const sim={tipo:'gasto',desc:'',valor:'',vezes:1,onde:'',data:new Date().toISOString().slice(0,10),dividir:1,meses:6,catE:'Entrada única'};
function vSim(main){
  const cartoes=(P.cfg.cartoes||[]).map(c=>c.nome); if(!sim.onde) sim.onde=cartoes[0]||C3;
  const g=sim.tipo==='ganho';
  main.innerHTML=`<div class="view"><section class="panel"><div class="panel-head"><h2>Simulador</h2><span class="note">nada é salvo até você clicar em “Lançar de verdade”</span></div>
   <div class="subtabs" role="group" aria-label="Tipo de simulação"><button data-st="gasto" aria-pressed="${!g}">Compra ou gasto</button><button data-st="ganho" aria-pressed="${g}">Ganho ou entrada</button></div>
   <form id="sf" class="form" onsubmit="return false">
    <label class="wide">${g?'O que você vai receber':'O que você quer comprar'}<input name="desc" value="${esc(sim.desc)}" placeholder="${g?'ex.: freela, bolsa nova, venda':'ex.: passagem para o Rio'}"></label>
    <label>Valor total (R$)<input name="valor" inputmode="decimal" value="${esc(sim.valor)}"></label>
    <label>${g?'Em quantos meses':'Vezes'}<input name="vezes" inputmode="numeric" value="${sim.vezes}"></label>
    ${g?`<label>Categoria<select name="catE">${opts(P.cfg.catEntrada||[],sim.catE)}</select></label>`:`<label>Onde<select name="onde">${opts(cartoes.concat([C3]),sim.onde)}</select></label>`}
    <label>${g?'Data do 1º recebimento':'Data da compra'}<input type="date" name="data" value="${sim.data}"></label>
    ${g?'':`<label>Dividir entre (pessoas, contando você)<input name="dividir" inputmode="numeric" value="${sim.dividir}"></label>`}
    <label>Meses para mostrar<input name="meses" inputmode="numeric" value="${sim.meses}"></label>
   </form><div id="sres"></div></section></div>`;
  main.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ sim.tipo=b.dataset.st; render() });
  const sf=$('#sf'); sf.addEventListener('input',()=>{ clearTimeout(sf._t); sf._t=setTimeout(()=>{ new FormData(sf).forEach((v,k)=>sim[k]=v); drawSim() },200) });
  drawSim();
}
function simRecord(){
  const valor=parseMoney(sim.valor), vezes=Math.max(1,parseInt(sim.vezes)||1), div=Math.max(1,parseInt(sim.dividir)||1);
  if(valor==null||Number.isNaN(valor)||valor<=0) return null;
  if(sim.tipo==='ganho') return {kind:'entradas',rec:{desc:sim.desc||'Ganho simulado',data:sim.data,vezes,total:valor,cat:sim.catE||'Entrada única'}};
  const base={desc:sim.desc||'Compra simulada',data:sim.data};
  if(vezes===1&&sim.onde!==C3&&div===1) return {kind:'compras',rec:{...base,cartao:sim.onde,cat:'Extras',valor}};
  return {kind:'fixos',rec:{...base,tipo:'Parcelamento',onde:sim.onde,vezes,total:valor,dividir:div>1?div:undefined,voltam:div>1&&sim.onde!==C3?div-1:undefined}};
}
function drawSim(){
  const box=$('#sres'); const sr=simRecord(); const g=sim.tipo==='ganho';
  if(!sr){ box.innerHTML=`<p class="empty">Digite o valor para ver ${g?'em quais meses o dinheiro entra':'em quais faturas a compra cai'} e como fica cada mês.</p>`; return }
  let extra,x,ini,fim,porMes,pesa;
  if(sr.kind==='compras'){ x=Calc.compra(sr.rec,P.cfg); extra={compras:[x]}; ini=fim=x.fat; porMes=pesa=x.valor }
  else if(sr.kind==='fixos'){ x=Calc.fixo(sr.rec,P.cfg); extra={fixos:[x]}; ini=x.ini; fim=x.fim; porMes=x.cheio; pesa=sr.rec.onde===C3?x.sua:x.cheio-x.volta }
  else { x=Calc.entrada(sr.rec); extra={entradas:[x]}; ini=x.ini; fim=x.fim; porMes=pesa=x.cheio }
  if(ini==null){ box.innerHTML='<p class="empty">Confira a data.</p>'; return }
  const n=Math.max(parseInt(sim.meses)||6,fim-ini+1); const rows=[];
  for(let a=ini;a<ini+n;a++){ const antes=Calc.mes(P,a), depois=Calc.mes(P,a,extra); rows.push({a,antes:antes.dif_,depois:depois.dif_,imp:depois.dif_-antes.dif_}) }
  const pior=rows.reduce((m,r)=>r.depois<m.depois?r:m,rows[0]);
  const viraNeg=rows.filter(r=>r.depois<0&&r.antes>=0).length, saiNeg=rows.filter(r=>r.antes<0&&r.depois>=0).length;
  const aviso=g?(saiNeg?`<div class="banner" style="margin-top:12px;border-color:var(--good);color:var(--good)">Com esse ganho, ${saiNeg} ${saiNeg===1?'mês sai':'meses saem'} do vermelho.</div>`:`<p class="note" style="margin-top:12px">${rows.some(r=>r.depois<0)?'Mesmo com esse ganho, algum mês continua no vermelho.':'Nenhum mês fica no vermelho.'}</p>`)
    :(viraNeg?`<div class="banner bad" style="margin-top:12px">Com essa compra, ${viraNeg} ${viraNeg===1?'mês passa':'meses passam'} a fechar no vermelho.</div>`:`<p class="note" style="margin-top:12px">${rows.some(r=>r.depois<0)?'Alguns meses já estavam no vermelho antes da compra.':'Nenhum mês fica no vermelho por causa dessa compra.'}</p>`);
  const sinal=v=>v>0.004?'+'+money(v):v<-0.004?'−'+money(-v):'';
  box.innerHTML=`<div class="kpis" style="margin-top:6px">
     <div class="kpi"><div class="lbl">${g?'Entra nos meses':'Cai nas faturas'}</div><div class="val" style="font-size:16px">${mshort(ini)}${fim!==ini?' → '+mshort(fim):''}</div></div>
     <div class="kpi"><div class="lbl">${g?'Por mês':(sr.kind==='compras'?'Valor':'Parcela')}</div><div class="val num">${money(porMes)}</div></div>
     <div class="kpi"><div class="lbl">${g?'Soma no seu mês':'Pesa no seu mês'}</div><div class="val num ${g?'pos':''}">${money(pesa)}</div></div>
     <div class="kpi"><div class="lbl">Mês mais apertado</div><div class="val num ${pior.depois<0?'neg':'pos'}" style="font-size:16px">${mshort(pior.a)} · ${money(pior.depois)}</div></div></div>
   ${aviso}
   <div class="scroll" style="margin-top:10px"><table><thead><tr><th>Mês</th><th class="r">Sobra hoje</th><th class="r">${g?'Este ganho':'Esta compra'}</th><th class="r">Sobra com ${g?'o ganho':'a compra'}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${mtxt(r.a).toLowerCase()}</td><td class="r num ${r.antes<0?'neg':''}">${money(r.antes)}</td><td class="r num ${r.imp>0?'pos':''}">${sinal(r.imp)}</td><td class="r num ${r.depois<0?'cell-bad':'pos'}">${money(r.depois)}</td></tr>`).join('')}</tbody></table></div>
   <p class="note">${sr.kind==='fixos'&&Number(sim.dividir)>1?(sr.rec.onde===C3?'No cartão de outra pessoa entra só a sua parte. ':'As partes das outras pessoas entram como “voltam para você” nos estornos de cada mês. '):''}A sobra de cada mês considera tudo o que já está lançado.</p>
   <div class="actions"><button class="primary" id="simGo">Lançar de verdade</button></div>`;
  $('#simGo').onclick=async()=>{ const col=COLS[sr.kind]; const o=clean({...sr.rec,ordem:Date.now()}); if(await put(col,newId(sr.kind[0]),o)){ toast('Lançado em '+({compras:'Compras',fixos:'Fixos e parcelas',entradas:'Entradas'})[sr.kind]); sim.valor=''; render() } };
}

/* ===================== CONFERIR EXTRATO / FATURA ===================== */
const conf={tipo:'fatura',cartao:'',itens:null,arquivo:'',saldo:null,ate:null,erro:'',sel:{},cat:{}};
function lerOFX(txt){
  const tag=(b,t)=>{ const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m?m[1].trim():'' };
  const d8=s=>s&&s.length>=8?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8):null;
  const itens=[]; const re=/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi; let m;
  while((m=re.exec(txt))){ const b=m[1]; const v=parseFloat(tag(b,'TRNAMT').replace(',','.')); if(isNaN(v)) continue;
    itens.push({data:d8(tag(b,'DTPOSTED')),desc:tag(b,'MEMO')||tag(b,'NAME'),valor:v}) }
  const bal=parseFloat(tag(txt,'BALAMT'));
  return {tipo:/CREDITCARDMSGSRSV1/i.test(txt)?'fatura':'extrato',itens,saldo:isNaN(bal)?null:bal,ate:d8(tag(txt,'DTASOF'))||d8(tag(txt,'DTEND'))};
}
function lerCSV(txt){
  const linhas=txt.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(linhas.length<2) return {tipo:null,itens:[]};
  const sep=(linhas[0].split(';').length>linhas[0].split(',').length)?';':',';
  const split=l=>{ const out=[]; let cur='',q=false; for(const ch of l){ if(ch==='"'){ q=!q; continue } if(ch===sep&&!q){ out.push(cur); cur=''; continue } cur+=ch } out.push(cur); return out.map(s=>s.trim()) };
  const h=split(linhas[0]).map(s=>s.toLowerCase());
  const ci=(...ns)=>h.findIndex(x=>ns.some(n=>x.includes(n)));
  const iD=ci('data','date'), iV=ci('valor','amount','value'), iT=ci('descri','title','memo','hist','estabelec');
  if(iD<0||iV<0) throw new Error('não achei as colunas de data e valor no arquivo');
  const fat=h.includes('title')||h.includes('amount');   // CSV da fatura do Nubank: valor positivo = compra
  const dt=s=>{ let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3]; m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m?m[3]+'-'+m[2]+'-'+m[1]:null };
  const itens=linhas.slice(1).map(split).map(c=>{ let v=parseMoney(c[iV]); if(v==null||Number.isNaN(v)) return null; if(fat) v=-v; return {data:dt(c[iD]||''),desc:c[iT]||'',valor:v} }).filter(Boolean);
  return {tipo:fat?'fatura':null,itens};
}
function adivinharCat(d){ d=String(d).toLowerCase();
  if(/ifood|99food|food|restaurant|lanch|sorvet|padaria|panific|pizza|burg|subway|chopp|feira|mercado|super/.test(d)) return 'iFood + Fome';
  if(/uber|^99|99 -|99pop|taxi|moto|metr|ônibus|onibus|jaé/.test(d)) return 'Uber/99';
  if(/farm|drog/.test(d)) return 'Autocuidado';
  return 'Extras' }
function diasEntre(a,b){ const x=pd(a),y=pd(b); if(!x||!y) return 99; return Math.abs((Date.UTC(x.y,x.m-1,x.d)-Date.UTC(y.y,y.m-1,y.d))/864e5) }
function classificar(){
  const isF=conf.tipo==='fatura', card=isF?conf.cartao:'Pix/Débito', fech=Calc.fech(P.cfg,card);
  const usadosC=new Set(), usadosE=new Set(), itens=conf.itens||[], pre={};
  // compra + estorno do mesmo dia e mesmo nome, lançados juntos (valor líquido)
  itens.forEach((t,i)=>{ if(t.valor>0&&!/pagamento/i.test(t.desc||'')&&!(i in pre)){
    const j=itens.findIndex((u,k)=>k!==i&&!(k in pre)&&u.valor<0&&u.data===t.data&&u.desc===t.desc);
    if(j>=0){ const liq=Math.round((-itens[j].valor-t.valor)*100)/100;
      const c=P.compras.find(c=>!usadosC.has(c.id)&&c.cartao===card&&Math.abs(c.valor-liq)<0.011&&diasEntre(c.data,t.data)<=3);
      if(c){ pre[i]=pre[j]=c.id; usadosC.add(c.id) } } } });
  return itens.map((t,i)=>{
    const v=Math.round(Math.abs(t.valor)*100)/100, saida=t.valor<0, d=t.desc||'';
    const r={...t,i,v,saida,onde:card,status:'novo'};
    if(i in pre) return {...r,status:'ok',motivo:'lançado junto com o estorno (valor líquido)',ref:pre[i]};
    if(/pagamento recebido|pagamento de fatura|^pagamento$/i.test(d)) return {...r,status:'ignorar',motivo:'pagamento de fatura'};
    if(!isF&&/valor adicionado|pix no cr[eé]dito/i.test(d)) return {...r,status:'ignorar',motivo:'Pix no crédito: já vem na fatura do cartão'};
    if(saida){
      const fat=Calc.absMes({data:t.data},fech);
      if(isF){
        const fx=P.fixos.find(f=>f.onde===card&&f.ini!=null&&f.ini<=fat&&fat<=f.fim&&Math.abs(f.cheio-v)<0.05);
        if(fx) return {...r,status:'fixo',motivo:'já está em Fixos e parcelas: '+fx.desc};
        if(/parcela\s*\d+\s*\/\s*\d+/i.test(d)) return {...r,status:'parcela',motivo:'parcela sem cadastro: cadastre em Fixos e parcelas'};
      }
      const c=P.compras.find(c=>!usadosC.has(c.id)&&c.cartao===card&&Math.abs(c.valor-v)<0.011&&(c.data?diasEntre(c.data,t.data)<=3:c.fat===fat));
      if(c){ usadosC.add(c.id); return {...r,status:'ok',motivo:'lançado como: '+c.desc,ref:c.id} }
      return {...r,kind:'compras',cat:adivinharCat(d)};
    }
    if(isF) return {...r,kind:'entradas',cat:'Estorno de compra',motivo:'crédito na fatura (estorno)'};
    const e=P.entradas.find(e=>!usadosE.has(e.id)&&Math.abs((nn(e.total)!=null?e.total:e.cheio)-v)<0.011&&(e.data?diasEntre(e.data,t.data)<=3:true));
    if(e){ usadosE.add(e.id); return {...r,status:'ok',motivo:'lançado como: '+e.desc,ref:e.id} }
    return {...r,kind:'entradas',cat:'Estorno de amigos'};
  });
}
function vConferir(main){
  const cartoes=(P.cfg.cartoes||[]).map(c=>c.nome).filter(n=>n!=='Pix/Débito'); if(!conf.cartao) conf.cartao=cartoes[0]||'';
  const lista=conf.itens?classificar():[];
  lista.forEach(x=>{ if(x.status==='novo'&&!(x.i in conf.sel)) conf.sel[x.i]=x.kind==='compras' });
  const cnt=s=>lista.filter(x=>x.status===s).length, nSel=lista.filter(x=>x.status==='novo'&&conf.sel[x.i]).length;
  let fora=[];
  if(lista.length){ const ds=lista.map(x=>x.data).filter(Boolean).sort(); const card=conf.tipo==='fatura'?conf.cartao:'Pix/Débito'; const refs=new Set(lista.filter(x=>x.ref).map(x=>x.ref));
    fora=P.compras.filter(c=>c.cartao===card&&c.data&&c.data>=ds[0]&&c.data<=ds[ds.length-1]&&!refs.has(c.id)&&c.cat!==PAG).sort((a,b)=>a.data.localeCompare(b.data)) }
  let saldoHtml='';
  if(conf.tipo==='fatura'&&conf.saldo!=null&&conf.ate){ const d=pd(conf.ate); const dia=new Date(Date.UTC(d.y,d.m-1,d.d-1)); const ref=dia.toISOString().slice(0,10);
    const a=Calc.absMes({data:ref},Calc.fech(P.cfg,conf.cartao)); conf.saldoMes=a;
    saldoHtml=`<div class="banner" style="margin-top:10px">O arquivo mostra <b class="num">${money(Math.abs(conf.saldo))}</b> na fatura do ${esc(conf.cartao)} (até ${fmtD(conf.ate)}). <button class="link" id="cfSaldo">Usar como “fatura do app” de ${mtxt(a).toLowerCase()}</button></div>` }
  const chip=x=>({ok:'<span class="chip" style="background:var(--good);color:#fff">já lançado</span>',novo:'<span class="chip" style="background:var(--accent);color:var(--accent-ink)">novo</span>',fixo:'<span class="chip">fixo/assinatura</span>',parcela:'<span class="chip" style="background:var(--warn);color:#fff">parcela sem cadastro</span>',ignorar:'<span class="chip">ignorado</span>'})[x.status];
  main.innerHTML=`<div class="view"><section class="panel"><div class="panel-head"><h2>Conferir extrato ou fatura</h2><span class="note">compara o arquivo do banco com o que está lançado e lança o que faltar</span></div>
   <div class="form">
    <label>O arquivo é<select id="cfTipo"><option value="fatura" ${conf.tipo==='fatura'?'selected':''}>Fatura de cartão</option><option value="extrato" ${conf.tipo==='extrato'?'selected':''}>Extrato da conta (Pix e débito)</option></select></label>
    ${conf.tipo==='fatura'?`<label>Cartão<select id="cfCard">${opts(cartoes,conf.cartao)}</select></label>`:''}
    <label class="wide">Arquivo (.ofx ou .csv)<input type="file" id="cfFile" accept=".ofx,.qfx,.csv,.txt,.pdf"></label>
   </div>
   <p class="note">No app do Nubank: na fatura, use “Exportar” (OFX ou CSV); na conta, peça o extrato em OFX ou CSV. Arquivo PDF não dá para ler aqui.</p>
   ${conf.erro?`<div class="banner bad">${esc(conf.erro)}</div>`:''}
   ${conf.itens?`<p class="note">${esc(conf.arquivo)} · ${lista.length} movimentos · <b>${cnt('ok')}</b> já lançados · <b>${cnt('novo')}</b> novos · ${cnt('fixo')} fixos ou assinaturas · ${cnt('parcela')} parcelas sem cadastro · ${cnt('ignorar')} ignorados</p>`:''}
   ${saldoHtml}
  </section>
  ${lista.length?`<section class="panel"><div class="panel-head"><h2>Movimentos do arquivo</h2><button class="primary" id="cfGo" ${nSel?'':'disabled'}>Lançar selecionados (${nSel})</button></div>
   <div class="scroll"><table><thead><tr><th></th><th>Data</th><th>Descrição</th><th class="r">Valor</th><th>Situação</th><th>Categoria</th></tr></thead><tbody>
   ${lista.map(x=>`<tr><td>${x.status==='novo'?`<input type="checkbox" data-sel="${x.i}" ${conf.sel[x.i]?'checked':''} aria-label="Lançar este movimento">`:''}</td><td class="num">${fmtD(x.data)}</td><td>${esc(x.desc)}${x.motivo?`<div class="note">${esc(x.motivo)}</div>`:''}</td><td class="r num ${x.saida?'':'pos'}">${x.saida?'':'+'}${money(x.v)}</td><td>${chip(x)}</td><td>${x.status==='novo'?`<select data-cat="${x.i}" aria-label="Categoria">${opts(x.kind==='compras'?(P.cfg.catCompra||[]):(P.cfg.catEntrada||[]),conf.cat[x.i]||x.cat)}</select><div class="note">${x.kind==='compras'?'compra · '+esc(x.onde):'entrada'}</div>`:''}</td></tr>`).join('')}
   </tbody></table></div>
   <p class="note">${conf.tipo==='extrato'?'Pix da Vovó e da Mãe: não lance aqui; digite o total do mês em Ano detalhado. Transferências entre as suas contas também ficam de fora. ':''}Entradas novas vêm desmarcadas: marque só as que são mesmo dinheiro que entrou.</p></section>`:''}
  ${fora.length?`<section class="panel"><h2>Lançados no painel, mas não estão no arquivo</h2><p class="note">Mesmo período e ${conf.tipo==='fatura'?'mesmo cartão':'mesma conta'}. Confira se não foram lançados duas vezes ou com valor diferente. Clique para abrir.</p>
   <div class="scroll"><table><tbody>${fora.map(c=>`<tr class="click" data-fora="${c.id}"><td class="num">${fmtD(c.data)}</td><td>${esc(c.desc)}</td><td>${esc(c.cat||'')}</td><td class="r num">${money(c.valor)}</td></tr>`).join('')}</tbody></table></div></section>`:''}
  </div>`;
  $('#cfTipo').onchange=e=>{ conf.tipo=e.target.value; conf.sel={}; render() };
  if($('#cfCard')) $('#cfCard').onchange=e=>{ conf.cartao=e.target.value; conf.sel={}; render() };
  $('#cfFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; conf.erro=''; conf.sel={}; conf.cat={};
    try{ if(/\.pdf$/i.test(f.name)) throw new Error('PDF não dá para ler aqui. Exporte o arquivo em OFX ou CSV no app do banco.');
      const txt=await f.text(); const r=/<OFX>|OFXHEADER/i.test(txt)?lerOFX(txt):lerCSV(txt);
      if(!r.itens.length) throw new Error('Não achei movimentos nesse arquivo.');
      conf.itens=r.itens; conf.arquivo=f.name; conf.saldo=r.saldo??null; conf.ate=r.ate||null; if(r.tipo) conf.tipo=r.tipo;
    }catch(err){ conf.itens=null; conf.erro=err.message||'Não consegui ler o arquivo.' }

  main.querySelectorAll('[data-sel]').forEach(cb=>cb.onchange=()=>{ conf.sel[cb.dataset.sel]=cb.checked; render() });

function serialData(s){ const d=pd(s); if(!d) return null; return (Date.UTC(d.y,d.m-1,d.d)-Date.UTC(1899,11,30))/86400000 }
function montarAbas(){ // devolve [{nome, linhas, larguras, moeda:[colunas], data:[colunas], titulo:[linhas em negrito]}]
  const abas=[]; const cards=(P.cfg.cartoes||[]).map(c=>c.nome); const r2=v=>v==null||isNaN(v)?null:Math.round(v*100)/100;
  // LEIA-ME
  abas.push({nome:'LEIA-ME',larguras:[110],linhas:[
    ['Só Se Vive Uma Vez: Sem Parar no Serasa · planilha exportada em '+new Date().toLocaleDateString('pt-BR')],[''],
    ['Esta planilha traz os valores já calculados pelo painel (sem fórmulas): abas de cada ano, compras, fixos e parcelas, entradas, cofrinho, viagens e cartões.'],
    ['Os meses das abas dos anos são meses de FATURA (pelo dia de fechamento de cada cartão), como no painel.'],
    ['Para voltar a ter a planilha completa, com fórmulas que recalculam sozinhas, baixe também "Tudo (.json)" no painel e peça ao Claude para gerar a planilha a partir dele.']]});
  // anos
  anosDisponiveis().forEach(y=>{
    const ms=Calc.ano(P,y); const has=ms.some(x=>x.in||x.out||x.totCompras); if(!has) return;
    const L=[['FINANÇAS '+y+' · detalhado'],['',...MESES.map(m=>m.charAt(0)+m.slice(1).toLowerCase()),'TOTAL']];
    const tit=[0,1]; const row=(lbl,fn,bold)=>{ const v=ms.map(x=>r2(fn(x))); L.push([lbl,...v,r2(v.reduce((s,a)=>s+(a||0),0))]); if(bold) tit.push(L.length-1) };
    const sec=t=>{ L.push([t]); tit.push(L.length-1) };
    sec('ENTRADAS'); row('Vovó',x=>x.vovo); row('Mãe',x=>x.mae); row('Bolsa(s)',x=>x.bolsa); row('Extras (entradas únicas)',x=>x.extras); row('Recebimentos parcelados',x=>x.receb); row('Estornos (amigos, compras e partes dos outros)',x=>x.estornos); row('SOMA IN',x=>x.in,1);
    sec('SAÍDAS'); row('Fixos e parcelas (valor cheio)',x=>x.fixos); cards.forEach(n=>row(n+' · compras',x=>x.cards[n])); row("Cartão de 3º (sua parte)",x=>x.c3); row('Empréstimos',x=>x.loan); row('SOMA OUT',x=>x.out,1); row('DIFERENÇA (sobrou)',x=>x.dif_,1);
    row('Cofrinho · depositado',x=>x.cofre); row('Cofrinho · planejado pelas metas',x=>x.cofreP);
    sec('FATURA DOS CARTÕES'); cards.forEach(n=>{ row(n+': fatura (compras + fixos)',x=>x.fat[n]); row('   falta pagar',x=>x.falta[n]); row('   fatura do app',x=>x.app[n]); row('   diferença (falta pagar − app)',x=>x.dif[n]) });
    row('A cobrar dos outros',x=>x.cobrar);
    sec('COMPRAS POR CATEGORIA'); (P.cfg.catCompra||[]).forEach(k=>row(k,x=>x.cat[k])); row('Sem categoria',x=>x.semCat); row('TOTAL DAS COMPRAS',x=>x.totCompras,1); row('Sem cartão marcado',x=>x.semCartao);
    sec('FIXOS E PARCELAS POR TIPO (valor cheio)'); (P.cfg.tipos||[]).forEach(k=>row(k,x=>x.tipo[k])); row('TOTAL DO CADASTRO',x=>x.totCad,1);
    sec('ENTRADAS POR CATEGORIA'); (P.cfg.catEntrada||[]).forEach(k=>row(k,x=>x.catE[k]));
    abas.push({nome:String(y),linhas:L,larguras:[44,...Array(13).fill(12)],moeda:[...Array(13).keys()].map(i=>i+1),titulo:tit,congelar:true});
  });
  // compras
  const cs=P.compras.slice().sort((a,b)=>(a.fat-b.fat)||String(a.data||'').localeCompare(String(b.data||''))||((a.ordem||0)-(b.ordem||0)));
  abas.push({nome:'COMPRAS',larguras:[11,40,16,18,12,12,8,18],moeda:[4],data:[0],titulo:[0],congelar:true,linhas:[['DATA','DESCRIÇÃO','CARTÃO','CATEGORIA','VALOR','MÊS (à mão)','ANO','FATURA'],
    ...cs.map(c=>[serialData(c.data),c.desc||'',c.cartao||'',c.cat||'',r2(c.valor),c.mes?MESES[c.mes-1]:'',c.mes?(c.ano||''):'',mtxt(c.fat)])]});
  // fixos
  const fs=P.fixos.slice().sort((a,b)=>(a.ini-b.ini)||((a.ordem||0)-(b.ordem||0)));
  abas.push({nome:'FIXOS E PARCELAS',larguras:[40,14,16,11,7,13,13,16,9,9,26,14,18,13,13,13,18,18],moeda:[5,6,13,14,15],data:[3],titulo:[0],congelar:true,linhas:[['DESCRIÇÃO','TIPO','ONDE','DATA (1ª)','VEZES','VALOR TOTAL','PARCELA','1ª FATURA (à mão)','DIVIDIR','VOLTAM','COM QUEM','DE TERCEIRO','ÚLTIMA COBRANÇA','POR MÊS (cheio)','SUA PARTE','VOLTA P/ VOCÊ','1ª FATURA','ÚLTIMA'],
    ...fs.map(f=>[f.desc||'',f.tipo||'',f.onde||'',serialData(f.data),f.vezes||'',r2(f.total),r2(f.parcela),f.mes?MESES[f.mes-1]+' '+(f.ano||''):'',f.dividir||'',f.voltam??'',f.pessoas||'',f.terceiro||'',f.ultMes?MESES[f.ultMes-1]+' '+(f.ultAno||''):'',r2(f.cheio),r2(f.sua),r2(f.volta),mtxt(f.ini),mtxt(f.fim)])]});
  // entradas
  const es=P.entradas.slice().sort((a,b)=>(a.ini-b.ini)||String(a.data||'').localeCompare(String(b.data||'')));
  abas.push({nome:'ENTRADAS',larguras:[11,36,22,20,7,13,13,13,18,18],moeda:[5,6,7],data:[0],titulo:[0],congelar:true,linhas:[['DATA','DESCRIÇÃO','DE QUEM','CATEGORIA','VEZES','VALOR TOTAL','POR MÊS (informado)','POR MÊS (calculado)','1º MÊS','ÚLTIMO MÊS'],
    ...es.map(e=>[serialData(e.data),e.desc||'',e.deQuem||'',e.cat||'',e.vezes||'',r2(e.total),r2(e.parcela),r2(e.cheio),mtxt(e.ini),mtxt(e.fim)])]});
  // cofrinho
  const guard=n=>P.deps.filter(d=>d.meta===n).reduce((s,d)=>s+(d.valor||0),0);
  const cof=[['METAS'],['META','VALOR','INÍCIO','FIM','MESES','GUARDAR/MÊS','JÁ GUARDADO','FALTA']];
  P.metas.forEach(m=>cof.push([m.nome,r2(m.valor),mtxt(m.ini),mtxt(m.fim),m.meses||'',r2(m.porMes),r2(guard(m.nome)),r2(Math.max(0,m.valor-guard(m.nome)))]));
  cof.push([''],['DEPÓSITOS'],['META','MÊS','ANO','VALOR']); const t2=cof.length-1;
  P.deps.slice().sort((a,b)=>(a.ano*12+a.mes)-(b.ano*12+b.mes)).forEach(d=>cof.push([d.meta,MESES[d.mes-1],d.ano,r2(d.valor)]));
  abas.push({nome:'COFRINHO',larguras:[26,13,16,16,8,13,13,13],moeda:[1,5,6,7],titulo:[0,1,t2-1,t2],linhas:cof});
  // viagens
  const vi=[]; const vt=[];
  S.viagens.slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0)).forEach(t=>{
    vi.push([t.nome||'Viagem',t.onde||'']); vt.push(vi.length-1);
    vi.push(['SEÇÃO','ITEM','ESTIMADO','GASTO','DIVIDIR ENTRE','SUA PARTE (est.)','SUA PARTE (gasto)']); vt.push(vi.length-1);
    let e=0,g=0,se=0,sg=0; (t.itens||[]).forEach(i=>{ const dv=Math.max(1,i.div||1); e+=i.est||0; g+=i.gasto||0; se+=(i.est||0)/dv; sg+=(i.gasto||0)/dv;
      vi.push([i.secao==='durante'?'Durante':'Antes',i.nome||'',r2(i.est),r2(i.gasto),dv,r2((i.est||0)/dv),i.gasto==null?null:r2(i.gasto/dv)]) });
    vi.push(['TOTAL','',r2(e),r2(g),'',r2(se),r2(sg)]); vt.push(vi.length-1);
    if(t.obs) vi.push(['Obs.:',t.obs]); vi.push(['']);
  });
  abas.push({nome:'VIAGENS',larguras:[12,30,13,13,13,16,16],moeda:[2,3,5,6],titulo:vt,linhas:vi.length?vi:[['Nenhuma viagem cadastrada.']]});
  // cartões
  abas.push({nome:'CARTÕES',larguras:[22,18],titulo:[0],linhas:[['CARTÃO','DIA DE FECHAMENTO'],...(P.cfg.cartoes||[]).map(c=>[c.nome,c.fech||'sem fechamento (mês da data)'])]});
  return abas;
}
async function gerarXlsx(){
  const X=await carregarXlsxLib(); const wb=X.utils.book_new();
  montarAbas().forEach(a=>{
    const ws=X.utils.aoa_to_sheet(a.linhas);
    ws['!cols']=(a.larguras||[]).map(w=>({wch:w}));
    const ref=X.utils.decode_range(ws['!ref']||'A1');
    for(let R=ref.s.r;R<=ref.e.r;R++){ if((a.titulo||[]).includes(R)) continue;
      (a.moeda||[]).forEach(C=>{ const c=ws[X.utils.encode_cell({r:R,c:C})]; if(c&&c.t==='n') c.z='"R$" #,##0.00' });
      (a.data||[]).forEach(C=>{ const c=ws[X.utils.encode_cell({r:R,c:C})]; if(c&&c.t==='n') c.z='dd/mm/yyyy' }); }
    X.utils.book_append_sheet(wb,ws,a.nome.slice(0,31));
  });
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
